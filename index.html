const STORE = {
  async get(key) { return localStorage.getItem(key); },
  async set(key, value) { localStorage.setItem(key, String(value)); },
  async remove(key) { localStorage.removeItem(key); },
};

window.storage = {
  async get(key) {
    const value = localStorage.getItem(key);
    if (value === null) throw new Error("No such key: " + key);
    return { key, value };
  },
  async set(key, value) {
    localStorage.setItem(key, String(value));
    return { key, value: String(value) };
  },
  async delete(key) {
    const existed = localStorage.getItem(key) !== null;
    localStorage.removeItem(key);
    return { key, deleted: existed };
  },
  async list(prefix) {
    prefix = prefix || "";
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(prefix) === 0) keys.push(k);
    }
    return { keys, prefix };
  },
};

window.storageInfo = {
  mode: "browser",
  lastSource: "local",
  label: function () { return "Saved in this browser"; },
};

/* ------------------------------------------------------------------
   WORLD SIZE
   Height is fixed so gameplay never changes — ducks always fly at the same
   altitude and the water is always in the same place. WIDTH adapts to the
   device, because every phone since the iPhone 12 is about 2.17:1 while the
   old fixed 900x560 world is 1.61:1. Fitting that into a landscape phone
   left huge black bars; widening the world fills the screen instead, and
   gives you more sky to shoot across rather than a stretched picture.
------------------------------------------------------------------ */
const H = 560;
const W_MIN = 820;    // roughly an iPad / square-ish window
const W_MAX = 1300;   // widest phone, plus headroom

let W = 900;          // replaced by setWorldWidth() before the first frame

function clampW(v) {
  return Math.max(W_MIN, Math.min(W_MAX, v));
}

function worldWidthFor(vw, vh) {
  if (!vw || !vh) return 900;
  return Math.round(clampW(H * (vw / vh)));
}

/* Recompute the world and everything positioned relative to its width.
   Returns true when the width actually changed, so callers know to
   re-render the cached background. */
function setWorldWidth(next) {
  const w = Math.round(clampW(next));
  if (w === W) return false;
  W = w;
  GUN_PIVOT.x = W / 2;          // the gun stays centred, FPS-style
  return true;

/* A species is offered once you reach its round, and hunts once you own it. */
function offeredDucks(round) {
  return DUCKS.filter((d) => round >= d.unlock);
}

function nextUnlock(round) {
  return DUCKS.find((d) => round < d.unlock) || null;
}

function pickDuckType(round, owned, placeId) {
  const onRidge = placeId === "ridge";
  const pool = DUCKS.filter((d, i) => {
    if (onRidge) return d.onlyAt === "ridge";      // the ridge is turkeys only
    if (d.onlyAt) return false;                     // turkeys don't visit the marsh
    return owned[i] && round >= d.unlock;
  });
  if (!pool.length) return 0;
  const total = pool.reduce((a, d) => a + d.weight, 0);
  let r = Math.random() * total;
  for (const d of pool) {
    r -= d.weight;
    if (r <= 0) return DUCKS.indexOf(d);
  }
  return DUCKS.indexOf(pool[0]);
}

}

/* ------------------------------------------------------------------
   SAVE ADAPTER
   One swappable object. Everything the game does with persistence goes
   through here, so the storage backend can be replaced without touching
   game code.

   Web (now):     window.storage
   Native later:  Capacitor Preferences
   Game Center:   fill in submitScore / syncCloud below
------------------------------------------------------------------ */
const SAVE_KEY = "limitout:save:v1";
const PROBE_KEY = "limitout:probe";

const Save = {
  mem: null,          // fallback copy, survives screen changes but not a reload
  backend: "unknown", // "device" | "session"

  // Find out once whether a real storage backend exists.
  async probe() {
    try {
      await window.storage.set(PROBE_KEY, "1");
      await window.storage.get(PROBE_KEY);
      this.backend = "device";
    } catch {
      this.backend = "session";
    }
    return this.backend;
  },

  async load() {
    try {
      const r = await window.storage.get(SAVE_KEY);
      // localStorage is editable by anyone with devtools, so a stored save
      // gets the same validation as one pasted in from a code.
      const parsed = r ? this.sanitize(JSON.parse(r.value)) : null;
      if (parsed) this.mem = parsed;
      return parsed ?? this.mem;
    } catch {
      return this.mem; // missing key or no backend — fall back to memory
    }
  },

  async write(meta) {
    const data = {
      v: 1,
      hunter: meta.hunter,
      dogName: meta.dogName,
      money: meta.money,
      round: meta.round,
      best: meta.best,
      ducks: [...(meta.ducks || DUCKS.map((_, i) => i === 0))],
      places: [...(meta.places || PLACES.map((_, i) => i === 0))],
      place: meta.place ?? 0,
      hired: { ...(meta.hired || { dog2: false, hunter2: false }) },
      gb: meta.gb || 0,
      grants: [...(meta.grants || [])],
      weapon: meta.weapon || "pump",
      skin: meta.skin || "blued",
      weapons: [...(meta.weapons || ["pump"])],
      skins: [...(meta.skins || ["blued"])],
      dog2Name: meta.dog2Name || "",
      hunter2Name: meta.hunter2Name || "",
      lvl: { ...meta.lvl },
      saved: Date.now(),
    };
    this.mem = data;
    try {
      await window.storage.set(SAVE_KEY, JSON.stringify(data));
      this.backend = "device";
      return true;
    } catch {
      this.backend = "session";
      return false; // in-memory only; still playable this session
    }
  },

  async clear() {
    this.mem = null;
    try {
      await window.storage.delete(SAVE_KEY);
    } catch {
      /* nothing to clear */
    }
  },

  /* --- transfer codes ---------------------------------------------
     Each place the game runs (this page, a downloaded file, a Chrome
     extension) has its own separate storage. A code is the only way to
     carry a save across them. */
  encode(meta) {
    const data = {
      v: 1, hunter: meta.hunter, dogName: meta.dogName,
      money: meta.money, round: meta.round, best: meta.best,
      ducks: meta.ducks, places: meta.places, place: meta.place,
      hired: meta.hired, lvl: meta.lvl,
      gb: meta.gb, weapon: meta.weapon, skin: meta.skin,
      weapons: meta.weapons, skins: meta.skins,
    };
    return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  },

  /* A save code is UNTRUSTED INPUT. It can arrive from anywhere — a friend,
     a forum, a corrupted clipboard. Every field is clamped to a legal value
     before it reaches the game, because an out-of-range level like
     lvl.gun = 9999 makes GUN[9999] undefined and crashes on the next frame.
     JSON.parse is used rather than eval, so a code can never execute code;
     the risk here is bad DATA, not injected script. */
  sanitize(d) {
    if (!d || typeof d !== "object") return null;

    const int = (v, lo, hi, dflt) => {
      const n = Math.floor(Number(v));
      return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : dflt;
    };
    const str = (v, dflt, max) =>
      typeof v === "string" && v.trim() ? v.trim().slice(0, max) : dflt;
    const boolArr = (v, len, dflt) =>
      Array.from({ length: len }, (_, i) => (Array.isArray(v) ? !!v[i] : dflt(i)));

    const lvl = {};
    for (const key of Object.keys(BLANK_LVL)) {
      const max = (COST[key] ? COST[key].length : 1) - 1;
      lvl[key] = int(d.lvl && d.lvl[key], 0, max, 0);
    }

    // only ids that actually exist survive
    const weapons = Array.isArray(d.weapons)
      ? WEAPONS.filter((w) => d.weapons.includes(w.id)).map((w) => w.id)
      : [];
    if (!weapons.includes("pump")) weapons.unshift("pump");
    const skins = Array.isArray(d.skins)
      ? SKINS.filter((k) => d.skins.includes(k.id)).map((k) => k.id)
      : [];
    if (!skins.includes("blued")) skins.unshift("blued");

    const weapon = weapons.includes(d.weapon) ? d.weapon : "pump";
    const skin = skins.includes(d.skin) ? d.skin : "blued";

    const places = boolArr(d.places, PLACES.length, (i) => i === 0);
    places[0] = true;                                  // home is never lost
    let place = int(d.place, 0, PLACES.length - 1, 0);
    if (!places[place]) place = 0;                     // can't be somewhere you don't own

    return {
      hunter: str(d.hunter, "Hunter", 16),
      dogName: str(d.dogName, "Scout", 16),
      money: int(d.money, 0, 1e9, 0),
      round: int(d.round, 1, 100000, 1),
      best: int(d.best, 0, 100000, 0),
      gb: int(d.gb, 0, 1e6, 0),
      grants: Array.isArray(d.grants)
        ? d.grants.filter((g) => typeof g === "string").slice(0, 20)
        : [],
      ducks: DUCKS.map((dk, i) =>
        dk.onlyAt ? true : i === 0 ? true : Array.isArray(d.ducks) ? !!d.ducks[i] : false
      ),
      places,
      place,
      hired: {
        dog2: !!(d.hired && d.hired.dog2),
        hunter2: !!(d.hired && d.hired.hunter2),
      },
      weapon,
      skin,
      weapons,
      skins,
      lvl,
    };
  },

  decode(code) {
    try {
      if (typeof code !== "string" || code.length > 8000) return null;
      const d = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      return this.sanitize(d);
    } catch {
      return null;
    }
  },

  /* --- seams for the native build ---------------------------------
     submitScore(n): Game Center leaderboard (iOS) / Play Games (Android).
     No-op on web. Wire up in the Capacitor wrapper, not here. */
  async submitScore(/* best */) {
    return false;
  },
  async syncCloud() {
    return false;
  },
};

/* Put a ground bird in the air: it breaks upward and away, and becomes
   worth its flush bonus. This is the moment the turkey hunt turns into
   the shooting game the rest of Limit Out already is. */
function flushBird(s, d) {
  if (!d.onGround) return;
  d.onGround = false;
  d.flushed = true;
  const T = DUCKS[d.t ?? 0];
  // scatter: direction, speed and climb all vary, so one well-placed tap
  // can't sweep a whole flushed group
  d.vx = (Math.random() < 0.5 ? -1 : 1) * (185 + Math.random() * 150);
  d.climb = 240 + Math.random() * 130;       // px/sec upward, decaying
  d.bobAmp = 10;
  Sound.flush();
  for (let i = 0; i < 12; i++) {
    s.parts.push({
      x: d.x, y: d.y,
      vx: (Math.random() - 0.5) * 70,
      vy: -Math.random() * 80,
      life: 700 + Math.random() * 500, max: 1200,
      kind: "feather", rot: Math.random() * 6,
    });
  }
}

/* Reload on the wall clock, not on accumulated loop time.
   Safe to call from anywhere, any number of times per frame. */
function tryReload(s, m) {
  if (s.shells > 0) return;
  const now = performance.now();
  if (!Number.isFinite(s.reloadUntil) || s.reloadUntil <= 0) {
    s.reloadUntil = now + reloadFor(m);
    return;
  }
  if (now >= s.reloadUntil) {
    s.shells = shellsFor(m);
    s.refill = 320;
    s.reloadUntil = 0;
    Sound.pump();
  }
}

/* Bald cypress silhouette: flared buttress base, tapering trunk,
   flattened irregular crown, optional hanging moss. Deterministic per seed. */
function drawCypress(ctx, x, baseY, h, w, col, alpha, t, seed, moss) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  const sway = Math.sin(t / 2400 + seed) * (h * 0.008);
  const topY = baseY - h;

  // buttressed base — the wide flare is what reads as cypress
  ctx.beginPath();
  ctx.moveTo(x - w * 2.1, baseY);
  ctx.quadraticCurveTo(x - w * 0.8, baseY - h * 0.1, x - w * 0.44, baseY - h * 0.26);
  ctx.lineTo(x + w * 0.44, baseY - h * 0.26);
  ctx.quadraticCurveTo(x + w * 0.8, baseY - h * 0.1, x + w * 2.1, baseY);
  ctx.closePath();
  ctx.fill();

  // trunk
  ctx.beginPath();
  ctx.moveTo(x - w * 0.44, baseY - h * 0.24);
  ctx.quadraticCurveTo(x - w * 0.22 + sway * 0.5, baseY - h * 0.6, x - w * 0.13 + sway, topY);
  ctx.lineTo(x + w * 0.13 + sway, topY);
  ctx.quadraticCurveTo(x + w * 0.22 + sway * 0.5, baseY - h * 0.6, x + w * 0.44, baseY - h * 0.24);
  ctx.closePath();
  ctx.fill();

  // branches, alternating, longest at the bottom of the crown
  ctx.strokeStyle = col;
  for (let b = 0; b < 5; b++) {
    const by = topY + h * 0.055 * b + h * 0.02;
    const dir = (b + seed) % 2 === 0 ? 1 : -1;
    const len = w * (3.6 - b * 0.5) * (1 + ((seed * 7 + b) % 3) * 0.07);
    ctx.lineWidth = Math.max(1, w * 0.26 - b * 0.03 * w);
    ctx.beginPath();
    ctx.moveTo(x + sway, by + h * 0.02);
    ctx.quadraticCurveTo(x + sway + dir * len * 0.5, by - h * 0.025, x + sway + dir * len, by);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + sway + dir * len * 0.68, by - h * 0.012, len * 0.44, h * 0.032, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // flattened crown
  ctx.beginPath();
  ctx.ellipse(x + sway, topY + h * 0.035, w * 2.3, h * 0.055, 0, 0, Math.PI * 2);
  ctx.fill();

  // Spanish moss draping off the lower branches
  if (moss) {
    ctx.strokeStyle = C.moss;
    ctx.globalAlpha = alpha * 0.32;
    ctx.lineWidth = Math.max(1, w * 0.14);
    for (let m = 0; m < 7; m++) {
      const dir = m % 2 === 0 ? 1 : -1;
      const mx = x + sway + dir * w * (1.1 + (m % 4) * 0.7);
      const my = topY + h * (0.09 + (m % 3) * 0.05);
      const drop = h * (0.07 + ((m * 5) % 4) * 0.03);
      const drift = Math.sin(t / 1600 + m + seed) * 2;
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.quadraticCurveTo(mx + drift, my + drop * 0.6, mx + drift * 1.6, my + drop);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* Depth bands, front to back. Front trees are SHORT and dark, back trees

  // front

function drawBand(ctx, band, t, WATER_Y) {
  // enough repeats to span whatever width the world ended up
  const count = Math.max(band.n, Math.ceil(W / band.step) + 2);
  for (let i = 0; i < count; i++) {
    const seed = i * 7 + band.off;
    const x = band.off + i * band.step + ((seed * 29) % 34) - 17;
    const h = band.h + ((seed * 41) % band.hv);
    const w = band.w + ((seed * 13) % 100) / 100 * band.wv;
    const a = band.a + ((seed * 11) % 5) * 0.02;
    drawCypress(ctx, x, WATER_Y + band.y, h, w, C[band.col], a, t, seed, band.moss);
  }
}

/* The shotgun. Drawn along +x from the pivot, then rotated to point at the
   aim. Recoil pushes it back along its own axis; the reload dip drops the
   muzzle and runs the pump. */
/* Shade a hex colour toward white (positive) or black (negative). Saves
   hand-writing a light and dark variant for every one of the ten finishes. */
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) =>
    Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt))))
  );
  return "#" + ch.map((v) => v.toString(16).padStart(2, "0")).join("");
}

// Centre of the ejection port cut into the receiver (see the "#0B0E11"
// roundRect below) — the one true anchor for "where the chamber is",
// shared by the gun art and anything (like the eject spark) that needs
// to line up with it.
const EJECT_PORT = { x: 3, y: -8.5 };

// Maps a point in the gun's local drawing space to world/screen
// coordinates, by replaying the exact same transform stack drawGun()
// applies (translate, rotate, flip, recoil rotation, recoil slide).
// Keeping this in lock-step with drawGun means anything anchored to a
// local gun coordinate — like the eject spark below — stays glued to
// the art even as it lifts, kicks, or flips.
function gunToWorld(s, weapon, lx, ly) {
  const gun = s.gun;
  const kick = gun.recoil;
  const dip = gun.dip;
  const flip = Math.cos(gun.ang) < 0 ? -1 : 1;
  const lift = weapon.art.lift || 0;

  let x = lx - kick * 20, y = ly;                    // translate(-kick*20, 0)
  const rot2 = kick * 0.14 + dip * 0.26;              // rotate(kick*.14 + dip*.26)
  const x2 = x * Math.cos(rot2) - y * Math.sin(rot2);
  const y2 = x * Math.sin(rot2) + y * Math.cos(rot2);
  const y3 = y2 * flip;                               // scale(1, flip)
  const ang = gun.ang;                                 // rotate(gun.ang)
  const x4 = x2 * Math.cos(ang) - y3 * Math.sin(ang);
  const y4 = x2 * Math.sin(ang) + y3 * Math.cos(ang);
  return {
    x: x4 + GUN_PIVOT.x,
    y: y4 + GUN_PIVOT.y + dip * 34 - lift,             // translate(pivot)
  };
}

/* The gun. Drawn from a per-weapon parts list so a tactical shotgun and a
   pump don't come out looking like the same object with a shorter barrel.
   Draw order matters: the barrel goes down BEFORE the handguard, or the
   barrel paints over the wood and the whole gun reads as steel. */
function drawGun(ctx, s, reloadProgress, weapon, skin) {
  const gun = s.gun;
  const kick = gun.recoil;
  const dip = gun.dip;
  const flip = Math.cos(gun.ang) < 0 ? -1 : 1;
  const A = weapon.art;

  ctx.save();
  ctx.translate(GUN_PIVOT.x, GUN_PIVOT.y + dip * 34 - (A.lift || 0));
  ctx.rotate(gun.ang);
  ctx.scale(1, flip);
  ctx.rotate(kick * 0.14 + dip * 0.26);
  ctx.translate(-kick * 20, 0);

  const steel = skin.metal;
  const steelLit = skin.lit;
  const steelDark = shade(skin.metal, -0.35);
  const wood = skin.wood;
  const woodLit = shade(skin.wood, 0.28);
  const woodDark = shade(skin.wood, -0.3);
  const BL = A.barrel;
  const bore = A.bore;
  // crossbow rail stops at the riser rather than running past the limb tips
  const RAIL_LEN = BL * 0.56 - 10;

  /* ---------- stock ---------- */
  if (A.stock === "wood" || A.stock === "poly") {
    ctx.fillStyle = A.stock === "wood" ? wood : steel;
    ctx.beginPath();
    ctx.moveTo(-40, -13);
    ctx.quadraticCurveTo(-130, -20, -230, 6);
    ctx.lineTo(-230, 34);
    ctx.quadraticCurveTo(-120, 26, -40, 15);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = A.stock === "wood" ? woodLit : steelLit;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-42, -12);
    ctx.quadraticCurveTo(-130, -18, -228, 8);
    ctx.stroke();
  } else if (A.stock === "tube") {
    // AR-style buffer tube with a slim adjustable stock
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.roundRect(-150, -8, 116, 16, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(-170, -16, 44, 34, 4);
    ctx.fill();
    ctx.fillStyle = steelDark;
    ctx.fillRect(-126, -4, 74, 3);
  } else if (A.stock === "folding") {
    // skeletonised folding stock — two thin struts, not a slab of wood
    ctx.strokeStyle = steel;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-40, -6);
    ctx.lineTo(-150, -18);
    ctx.moveTo(-40, 10);
    ctx.lineTo(-150, 10);
    ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(-150, -22);
    ctx.lineTo(-150, 14);
    ctx.stroke();
    ctx.lineCap = "butt";
  }

  /* ---------- pistol grip ---------- */
  if (A.grip) {
    // Behind the trigger guard (guard sits at x -20), raked back like a real
    // rifle grip. Magazine goes forward of the guard, further down.
    ctx.fillStyle = A.stock === "wood" ? wood : steel;
    ctx.beginPath();
    ctx.moveTo(-40, 12);
    ctx.lineTo(-66, 60);
    ctx.lineTo(-44, 68);
    ctx.lineTo(-20, 18);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = shade(A.stock === "wood" ? wood : steel, -0.4);
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(-44 - i * 5, 24 + i * 10);
      ctx.lineTo(-26 - i * 5, 30 + i * 10);
      ctx.stroke();
    }
  }

  /* ---------- receiver ---------- */
  ctx.fillStyle = steel;
  ctx.beginPath();
  ctx.roundRect(-46, -16, 96, 32, 4);
  ctx.fill();
  ctx.fillStyle = steelLit;
  ctx.fillRect(-44, -15, 92, 3);
  // A crossbow has no chamber to eject a case from — leave that stretch
  // of the receiver a flat, uncut stock instead of a firearm's port.
  if (A.form !== "crossbow") {
    ctx.fillStyle = "#0B0E11";
    ctx.beginPath();
    ctx.roundRect(-14, -14, 34, 11, 2);
    ctx.fill();
  }

  // Guard sits forward of the grip. It used to be centred at -20 with the
  // grip starting at -30, so the two overlapped and the grip covered the
  // trigger. Front-to-back is now: magazine, guard, grip — no overlap.
  ctx.strokeStyle = steel;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(A.grip ? -4 : -20, 24, 11, -0.2, Math.PI + 0.4);
  ctx.stroke();

  /* ---------- magazine ---------- */
  if (A.mag === "box") {
    // Straight AR-style stick magazine, hanging well clear of the receiver.
    // A pistol's magazine lives inside the grip; a rifle's hangs forward of
    // the trigger guard.
    const magX = A.form === "pistol" ? -8 : 8;
    const magLen = A.form === "pistol" ? 38 : 92;
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.roundRect(magX, 12, 24, magLen, 3);
    ctx.fill();
    ctx.fillStyle = steelDark;
    ctx.beginPath();
    ctx.roundRect(magX - 3, 12 + magLen - 8, 30, 10, 2);
    ctx.fill();
    if (A.form !== "pistol") {
      ctx.fillStyle = steelDark;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.roundRect(magX + 5, 26 + i * 14, 13, 5, 2);
        ctx.fill();
      }
      ctx.strokeStyle = steelLit;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(magX + 2, 16);
      ctx.lineTo(magX + 2, 12 + magLen - 10);
      ctx.stroke();
    }
  } else if (A.mag === "curved") {
    // AK banana magazine: long, and curving FORWARD toward the muzzle.
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.moveTo(8, 12);
    ctx.quadraticCurveTo(22, 56, 60, 92);     // outer edge sweeping forward
    ctx.lineTo(82, 74);
    ctx.quadraticCurveTo(46, 44, 34, 12);     // inner edge back to the receiver
    ctx.closePath();
    ctx.fill();

    // floorplate at the forward end
    ctx.fillStyle = steelDark;
    ctx.beginPath();
    ctx.moveTo(58, 94);
    ctx.lineTo(86, 72);
    ctx.lineTo(80, 64);
    ctx.lineTo(52, 86);
    ctx.closePath();
    ctx.fill();

    // ribs following the curve
    ctx.strokeStyle = steelDark;
    ctx.lineWidth = 2;
    for (let i = 1; i <= 3; i++) {
      const t = i / 4;
      ctx.beginPath();
      ctx.moveTo(8 + t * 18, 12 + t * 62);
      ctx.quadraticCurveTo(36 + t * 22, 30 + t * 46, 50 + t * 24, 44 + t * 40);
      ctx.stroke();
    }
    // lit edge along the back of the curve
    ctx.strokeStyle = steelLit;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, 14);
    ctx.quadraticCurveTo(23, 55, 59, 89);
    ctx.stroke();
  }

  /* ---------- barrel (BEFORE the handguard) ---------- */
  if (A.form === "crossbow") {
    // A single continuous arc per limb. No straight run at all — the curve
    // starts at the riser and keeps bending the whole way to the tip.
    const riserX = BL * 0.56, tipY = 66;

    ctx.lineCap = "round";
    [-1, 1].forEach((side) => {
      // one bezier from riser to tip, curving continuously
      ctx.strokeStyle = steel;
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(riserX, side * 4);
      ctx.bezierCurveTo(
        BL * 0.78, side * 8,      // leaves the riser almost flat
        BL * 1.02, side * 30,     // bends hard through the middle
        BL * 0.98, side * tipY    // and comes back in at the tip
      );
      ctx.stroke();

      // thinner outer edge, following the same path for a tapered look
      ctx.strokeStyle = steelLit;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(riserX + 2, side * 2);
      ctx.bezierCurveTo(
        BL * 0.78, side * 5,
        BL * 1.0, side * 28,
        BL * 0.965, side * (tipY - 3)
      );
      ctx.stroke();
    });

    // riser where the limbs meet the rail
    ctx.fillStyle = steelDark;
    ctx.beginPath();
    ctx.roundRect(riserX - 16, -13, 34, 26, 5);
    ctx.fill();

    // string to the nocks
    ctx.strokeStyle = "#E4DCC6";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(BL * 0.98, -tipY);
    ctx.lineTo(54, 0);
    ctx.lineTo(BL * 0.98, tipY);
    ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(50, -7);
    ctx.lineTo(50, 7);
    ctx.stroke();

    // Rail: stops at the riser instead of running past the limb tips.
    ctx.fillStyle = wood;
    ctx.beginPath();
    ctx.roundRect(28, -7, RAIL_LEN, 14, 4);
    ctx.fill();
    ctx.fillStyle = woodLit;
    ctx.fillRect(32, -6, RAIL_LEN - 8, 3);

    // Bolt: shaft along the rail, FLETCHING at the back (near the string),
    // BROADHEAD at the front. It was drawn with a solid red triangle at the
    // rear, which read as an arrowhead aimed at the shooter.
    const boltTip = 28 + RAIL_LEN + 16;
    ctx.strokeStyle = "#C9B591";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(52, 0);
    ctx.lineTo(boltTip - 12, 0);
    ctx.stroke();

    // broadhead, pointing away downrange
    ctx.fillStyle = "#C7CDD2";
    ctx.beginPath();
    ctx.moveTo(boltTip, 0);
    ctx.lineTo(boltTip - 14, -6);
    ctx.lineTo(boltTip - 14, 6);
    ctx.closePath();
    ctx.fill();

    // fletching — swept-back vanes at the nock end
    ctx.fillStyle = "#8C3A2E";
    ctx.beginPath();
    ctx.moveTo(52, 0); ctx.lineTo(68, -6); ctx.lineTo(70, -1); ctx.lineTo(54, 0);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(52, 0); ctx.lineTo(68, 6); ctx.lineTo(70, 1); ctx.lineTo(54, 0);
    ctx.closePath();
    ctx.fill();
    ctx.lineCap = "butt";
  } else {
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.moveTo(46, -bore - 6);
    ctx.lineTo(BL, -bore - 2);
    ctx.lineTo(BL, bore + 2);
    ctx.lineTo(46, bore + 6);
    ctx.closePath();
    ctx.fill();

    if (A.mag === "tube") {
      ctx.fillStyle = steelDark;
      ctx.beginPath();
      ctx.roundRect(52, 8, BL * 0.58, 9, 4);
      ctx.fill();
    }
    if (A.brake) {
      ctx.fillStyle = steelDark;
      ctx.beginPath();
      ctx.roundRect(BL - 22, -bore - 6, 26, (bore + 6) * 2, 2);
      ctx.fill();
      ctx.fillStyle = steel;
      for (let i = 0; i < 3; i++) ctx.fillRect(BL - 18 + i * 7, -bore - 6, 3, (bore + 6) * 2);
    }
  }

  /* ---------- handguard / forend, over the barrel ---------- */
  const slide = Math.sin(clamp(reloadProgress, 0, 1) * Math.PI) * -26 * dip;
  const fLen = Math.min(96, BL * 0.32);
  if (A.forend === "wood") {
    ctx.fillStyle = wood;
    ctx.beginPath();
    ctx.roundRect(64 + slide, -14, fLen, 28, 6);
    ctx.fill();
    ctx.fillStyle = woodLit;
    ctx.fillRect(68 + slide, -13, fLen - 10, 4);
    ctx.strokeStyle = woodDark;
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const gx = 76 + slide + i * 13;
      if (gx > 60 + fLen) break;
      ctx.beginPath();
      ctx.moveTo(gx, -9);
      ctx.lineTo(gx, 10);
      ctx.stroke();
    }
  } else if (A.forend === "rail") {
    // squared-off rail handguard with slots
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.roundRect(60 + slide, -15, fLen + 14, 30, 3);
    ctx.fill();
    ctx.fillStyle = steelDark;
    for (let i = 0; i < 7; i++) {
      const gx = 68 + slide + i * 14;
      if (gx > 56 + fLen) break;
      ctx.fillRect(gx, -8, 7, 16);
    }
    ctx.fillStyle = steelLit;
    ctx.fillRect(62 + slide, -14, fLen + 8, 3);
  }

  /* ---------- heat shield ---------- */
  if (A.shield) {
    ctx.fillStyle = steelDark;
    for (let i = 0; i < 6; i++) {
      const hx = 178 + i * ((BL - 220) / 6);
      ctx.beginPath();
      ctx.ellipse(hx, -bore - 5, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(hx, bore + 5, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------- side shell carrier ---------- */
  if (A.carrier) {
    ctx.fillStyle = steelDark;
    ctx.beginPath();
    ctx.roundRect(-40, -34, 82, 18, 3);
    ctx.fill();
    for (let i = 0; i < 5; i++) {
      const cx = -33 + i * 16;
      ctx.fillStyle = "#B8863A";      // brass
      ctx.beginPath();
      ctx.roundRect(cx, -32, 13, 14, 2);
      ctx.fill();
      ctx.fillStyle = "#8C1F1F";      // red hull
      ctx.beginPath();
      ctx.roundRect(cx, -32, 13, 6, 2);
      ctx.fill();
    }
  }

  /* ---------- rim light ---------- */
  ctx.strokeStyle = skin.shine ? "#FFFFFF" : C.amber;
  ctx.globalAlpha = skin.shine ? 0.5 : 0.22;
  ctx.lineWidth = skin.shine ? 2.4 : 1.5;
  ctx.beginPath();
  ctx.moveTo(52, -bore - 5);
  ctx.lineTo(BL - 4, -bore - 1.5);
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (skin.camo) {
    /* Camo containment, done by CONSTRUCTION rather than by clipping.

       Clipping alone kept failing: a clip region is only as tight as the
       path you give it, and every blob was still being GENERATED across a
       loose rectangle, so anything the clip missed hung off the edge.

       Now each part is described as a band — its top and bottom edge at any
       point along its length — and blobs are placed inside that band with
       their own radius subtracted from the room available. A blob therefore
       cannot reach an edge, let alone cross it. The clip stays as a second
       line of defence. */
    const tones = Array.isArray(skin.camo) ? skin.camo : ["#2E3320", "#4A4A2C", "#7A6B42"];

    // edges(t) -> [topY, bottomY] at position t (0 = back of part, 1 = front)
    const paintBand = (buildPath, xA, xB, edges, seedBase) => {
      ctx.save();
      ctx.beginPath();
      buildPath();
      ctx.clip();

      const len = Math.abs(xB - xA);
      const blobs = Math.max(5, Math.round(len / 20));

      for (let i = 0; i < blobs; i++) {
        const seed = (i + seedBase) * 7919;
        const t = (seed % 1000) / 1000;
        const x = xA + (xB - xA) * t;
        const [top, bot] = edges(t);
        const room = bot - top;
        if (room < 6) continue;

        // radius can never exceed the room left, so a blob always fits
        const ry = Math.min(room * 0.34, 3 + ((seed >> 7) % 5));
        const rx = Math.min(len * 0.16, ry * (1.4 + ((seed >> 5) % 10) / 10));
        const y = top + ry + (((seed >> 3) % 1000) / 1000) * (room - ry * 2);

        ctx.fillStyle = tones[i % tones.length];
        ctx.globalAlpha = 0.8;
        ctx.beginPath();
        ctx.moveTo(x - rx, y);
        ctx.quadraticCurveTo(x - rx * 0.5, y - ry * 1.4, x + rx * 0.3, y - ry);
        ctx.quadraticCurveTo(x + rx, y - ry * 0.4, x + rx * 0.8, y + ry * 0.6);
        ctx.quadraticCurveTo(x + rx * 0.2, y + ry * 1.3, x - rx * 0.6, y + ry * 0.7);
        ctx.closePath();
        ctx.fill();
      }

      // reed strokes, kept a couple of pixels inside the edges
      ctx.globalAlpha = 0.45;
      const reeds = Math.max(2, Math.round(len / 40));
      for (let i = 0; i < reeds; i++) {
        const seed = (i + seedBase) * 6151;
        const t = (seed % 1000) / 1000;
        const x = xA + (xB - xA) * t;
        const [top, bot] = edges(t);
        if (bot - top < 8) continue;
        ctx.strokeStyle = tones[(i + 2) % tones.length];
        ctx.lineWidth = 1.4 + ((seed >> 8) % 2);
        ctx.beginPath();
        ctx.moveTo(x, top + 2);
        ctx.quadraticCurveTo(x + 2, (top + bot) / 2, x, bot - 2);
        ctx.stroke();
      }

      // speckles
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = tones[tones.length - 1];
      const spots = Math.max(3, Math.round(len / 30));
      for (let i = 0; i < spots; i++) {
        const seed = (i + seedBase) * 4507;
        const t = (seed % 1000) / 1000;
        const x = xA + (xB - xA) * t;
        const [top, bot] = edges(t);
        if (bot - top < 8) continue;
        const r = 1.4 + (seed % 2);
        const y = top + r + (((seed >> 3) % 1000) / 1000) * (bot - top - r * 2);
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.8, seed, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    };

    const lerp = (a, b, t) => a + (b - a) * t;

    // --- barrel: a taper, so the band narrows toward the muzzle
    if (A.form !== "crossbow") {
      paintBand(
        () => {
          ctx.moveTo(46, -bore - 6);
          ctx.lineTo(BL, -bore - 2);
          ctx.lineTo(BL, bore + 2);
          ctx.lineTo(46, bore + 6);
          ctx.closePath();
        },
        48, BL - 2,
        (t) => [lerp(-bore - 6, -bore - 2, t), lerp(bore + 6, bore + 2, t)],
        1
      );
    }

    // --- receiver
    paintBand(() => ctx.rect(-46, -16, 96, 32), -44, 48, () => [-16, 16], 40);

    // --- wooden / poly stock: a slanted band, dropping as it goes back
    if (A.stock === "wood" || A.stock === "poly") {
      paintBand(
        () => {
          ctx.moveTo(-40, -13);
          ctx.quadraticCurveTo(-130, -20, -230, 6);
          ctx.lineTo(-230, 34);
          ctx.quadraticCurveTo(-120, 26, -40, 15);
          ctx.closePath();
        },
        -44, -226,
        // top edge runs -13 -> 6, bottom edge 15 -> 34, with a small inset
        // for the bow in the curve
        (t) => [lerp(-11, 8, t), lerp(13, 32, t)],
        80
      );
    }

    // --- AR buffer tube
    if (A.stock === "tube") {
      paintBand(() => ctx.rect(-150, -8, 116, 16), -148, -36, () => [-7, 7], 80);
    }

    // --- handguard / forend
    if (A.forend) {
      const fLen2 = Math.min(86, BL * 0.28);
      const fx = 64 + slide;
      paintBand(
        () => ctx.rect(fx, -13, fLen2, 26),
        fx + 2, fx + fLen2 - 2,
        () => [-12, 12],
        120
      );
    }

    // --- crossbow rail
    if (A.form === "crossbow") {
      paintBand(() => ctx.rect(28, -7, RAIL_LEN, 14), 30, 26 + RAIL_LEN, () => [-6, 6], 160);
    }
  }

  /* ---------- optics and sights ---------- */
  if (A.optic === "scope") {
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.roundRect(40, -34, 96, 18, 5);
    ctx.fill();
    ctx.fillStyle = steelDark;
    ctx.fillRect(46, -31, 84, 4);
    ctx.lineWidth = 5;
    ctx.strokeStyle = steel;
    ctx.beginPath();
    ctx.moveTo(58, -17); ctx.lineTo(58, -6);
    ctx.moveTo(118, -17); ctx.lineTo(118, -6);
    ctx.stroke();
    ctx.fillStyle = "#8FD6E8";
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.ellipse(134, -25, 3.5, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if (A.optic === "dot") {
    // compact red dot on a riser
    ctx.fillStyle = steelDark;
    ctx.fillRect(52, -18, 38, 6);
    ctx.fillStyle = steel;
    ctx.beginPath();
    ctx.roundRect(56, -40, 30, 24, 3);
    ctx.fill();
    ctx.fillStyle = "#101418";
    ctx.fillRect(60, -36, 22, 16);
    ctx.fillStyle = "#E8483A";
    ctx.beginPath();
    ctx.arc(71, -28, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(71, -28, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if (A.optic === "post") {
    // AK front sight block and rear notch
    ctx.fillStyle = steel;
    ctx.fillRect(BL - 46, -bore - 20, 9, 16);
    ctx.fillRect(60, -26, 8, 12);
    ctx.fillStyle = steelDark;
    ctx.fillRect(BL * 0.5, -bore - 13, 40, 7);
  } else {
    ctx.fillStyle = C.paper;
    ctx.beginPath();
    ctx.arc(BL - 6, -bore - 4, 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ---------- muzzle flash ---------- */
  if (gun.muzzle > 0) {
    const a = gun.muzzle / 130;
    const tip = BL + (A.brake ? 6 : 0);
    ctx.globalAlpha = a;
    ctx.fillStyle = C.paper;
    ctx.beginPath();
    ctx.moveTo(tip, -8);
    ctx.lineTo(tip + 54 * a, -22 * a);
    ctx.lineTo(tip + 74 * a, 0);
    ctx.lineTo(tip + 54 * a, 22 * a);
    ctx.lineTo(tip, 8);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = C.amber;
    ctx.beginPath();
    ctx.ellipse(tip + 30 * a, 0, 40 * a, 20 * a, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

const MUTE_KEY = "limitout:muted";

const Sound = {
  ctx: null,
  master: null,
  noiseBuf: null,
  muted: false,
  ready: false,

  init() {
    if (this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.55;

      // Compressor catches the peaks so the blast can hit hard without
      // clipping. Slow-ish attack lets the initial crack through intact.
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -9;
      this.comp.knee.value = 14;
      this.comp.ratio.value = 6;
      this.comp.attack.value = 0.005;
      this.comp.release.value = 0.2;

      this.master.connect(this.comp);
      this.comp.connect(this.ctx.destination);

      // Soft-clip curve. Real loud sounds distort — this is what separates
      // a gunshot's grit from a clean synthetic pop.
      const n = 1024;
      this.curve = new Float32Array(n);
      const k = 14;
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        this.curve[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
      }

      // one second of white noise, reused by every noise-based effect
      const len = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

      this.ready = true;
    } catch {
      this.ready = false;
    }
  },

  resume() {
    if (!this.ready) this.init();
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },

  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : 0.55;
  },

  // --- primitives -------------------------------------------------
  noise(dur, filterType, freq, gain, sweepTo) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = filterType;
    f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
    src.stop(t + dur);
  },

  tone(freq, dur, type, gain, toFreq, delay = 0) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  },

  /* Instant attack. The old helper ramped gain up over 8ms, which rounds off
     the transient — that softened edge is exactly what reads as "pop" rather
     than "bang". Here the gain starts at full on the first sample. */
  burst({ dur, type, freq, q, gain, sweepTo, delay = 0, dist = false, rate = 1 }) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = rate;
    const f = this.ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(freq, t);
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    if (q) f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(f);
    if (dist) {
      const ws = this.ctx.createWaveShaper();
      ws.curve = this.curve;
      f.connect(ws);
      ws.connect(g);
    } else {
      f.connect(g);
    }
    g.connect(this.master);
    src.start(t);
    src.stop(t + dur + 0.02);
  },

  /* Deep body — the part you feel rather than hear. */
  thump(f0, f1, dur, gain, delay = 0) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t); // instant
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  },

  /* A bubble's pitch RISES as it shrinks and rises through the water. That
     upward sweep is the single cue that makes a noise burst read as water
     instead of static. */
  bubble(f0, f1, dur, gain, delay = 0) {
    if (!this.ready || this.muted) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator();
    o.type = "sine";
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  },

  // --- effects ----------------------------------------------------
  shot() {
    // A gunshot is four layers, not one burst. The old version was too short,
    // too clean, and had nothing below 150Hz — hence "pop".
    // 1. the crack: instant, broadband, gone in 25ms
    this.burst({ dur: 0.025, type: "highpass", freq: 2400, gain: 1.0, dist: true });
    // 2. the body: this is the actual bang, driven into soft clipping
    this.burst({ dur: 0.19, type: "lowpass", freq: 1800, sweepTo: 260, gain: 0.95, dist: true });
    // 3. the chest thump: the low end that was missing entirely
    this.thump(90, 32, 0.3, 0.9);
    this.thump(58, 26, 0.42, 0.55);
    // 4. slap-back off the treeline, then a long tail across open water
    this.burst({ dur: 0.2, type: "bandpass", freq: 900, q: 1.1, gain: 0.2, delay: 0.14 });
    this.burst({ dur: 1.0, type: "lowpass", freq: 700, sweepTo: 160, gain: 0.14, delay: 0.05 });
  },

  dry() {
    // firing pin on an empty chamber
    this.noise(0.035, "highpass", 3500, 0.3);
    this.tone(900, 0.03, "square", 0.05);
  },

  pump() {
    // shuck-shuck of the pump action
    this.noise(0.06, "bandpass", 1400, 0.34);
    this.tone(320, 0.05, "square", 0.09);
    this.noise(0.07, "bandpass", 1000, 0.3);
    setTimeout(() => {
      this.noise(0.05, "bandpass", 1700, 0.3);
      this.tone(420, 0.04, "square", 0.08);
    }, 130);
  },

  hit() {
    this.noise(0.12, "lowpass", 700, 0.34, 250);
    this.tone(210, 0.09, "triangle", 0.16, 110);
  },

  splash() {
    // The old version was one bandpass noise burst — that's a "shh", which
    // reads as static or wind. Water needs impact, gulp, and bubbles.
    // 1. mass breaking the surface
    this.burst({ dur: 0.08, type: "lowpass", freq: 1400, sweepTo: 380, gain: 0.6 });
    // 2. the gulp of displaced water closing over it
    this.thump(240, 80, 0.13, 0.24);
    // 3. bubbles — the actual signature of water
    const n = 6 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const f0 = 280 + Math.random() * 520;
      this.bubble(
        f0,
        f0 * (1.6 + Math.random() * 1.1),
        0.045 + Math.random() * 0.06,
        0.09 + Math.random() * 0.07,
        0.02 + Math.random() * 0.26
      );
    }
    // 4. spray settling back down
    this.burst({ dur: 0.38, type: "highpass", freq: 2400, sweepTo: 5200, gain: 0.14, delay: 0.03 });
  },

  bark() {
    this.tone(420, 0.07, "sawtooth", 0.2, 260);
    this.tone(300, 0.09, "sawtooth", 0.14, 180, 0.09);
  },

  bank() {
    // duck into the bag
    this.tone(660, 0.07, "sine", 0.16);
    this.tone(880, 0.1, "sine", 0.14, null, 0.06);
  },

  cash() {
    [523, 659, 784].forEach((f, i) => this.tone(f, 0.16, "triangle", 0.16, null, i * 0.09));
  },

  best() {
    [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.24, "triangle", 0.2, null, i * 0.1));
  },

  flush() {
    // wingbeats hammering off the ground — fast, rhythmic, urgent
    for (let i = 0; i < 7; i++) {
      this.burst({ dur: 0.06, type: "bandpass", freq: 260 + i * 26, q: 1.6,
                   gain: 0.3 - i * 0.03, delay: i * 0.055 });
    }
    this.tone(180, 0.1, "triangle", 0.1, 320);
  },

  buckAppear() {
    // low double grunt so you look up before you see him
    this.tone(120, 0.13, "sawtooth", 0.12, 88);
    this.tone(108, 0.15, "sawtooth", 0.1, 78, 0.18);
  },

  buck() {
    // heavier than a bird: deep thump, then a rising payout chime
    this.thump(70, 26, 0.4, 0.75);
    this.burst({ dur: 0.22, type: "lowpass", freq: 900, sweepTo: 180, gain: 0.5, dist: true });
    [392, 523, 659, 880].forEach((f, i) =>
      this.tone(f, 0.28, "triangle", 0.2, null, 0.16 + i * 0.1));
  },

  lost() {
    // a bird slipping under — glugs, then a muffled swallow
    this.burst({ dur: 0.14, type: "lowpass", freq: 700, sweepTo: 200, gain: 0.26 });
    for (let i = 0; i < 4; i++) {
      const f0 = 200 + Math.random() * 220;
      this.bubble(f0, f0 * 1.5, 0.07, 0.09, i * 0.07);
    }
    this.thump(180, 60, 0.3, 0.16, 0.05);
  },
};

const MUTE_STORE = {
  async load() {
    try {
      const r = await window.storage.get(MUTE_KEY);
      return r?.value === "1";
    } catch {
      return false;
    }
  },
  async save(m) {
    try { await window.storage.set(MUTE_KEY, m ? "1" : "0"); } catch { /* fine */ }
  },
};

function drawDog(ctx, dog, coat, coatDark, coatLit, t, moving) {
  const facing = dog.state === "back" ? -1 : 1;
  const g = dog.gait;
  const bounce = moving ? Math.abs(Math.sin(g)) * 3.5 : 0;

  ctx.save();
  ctx.translate(dog.x, dog.y - bounce);
  ctx.scale(facing, 1);

  const swing = moving ? Math.sin(g) : 0;
  const swingB = moving ? Math.sin(g + Math.PI) : 0;

  // --- far legs first, darker, so the near pair reads in front
  const leg = (hipX, hipY, phase, w, col) => {
    const reach = phase * 9;
    const lift = Math.abs(phase) * 3;
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.quadraticCurveTo(hipX + reach * 0.4, hipY + 9, hipX + reach, 19 - lift);
    ctx.stroke();
    // paw
    ctx.beginPath();
    ctx.moveTo(hipX + reach, 19 - lift);
    ctx.lineTo(hipX + reach + 3.5, 19 - lift);
    ctx.stroke();
  };

  leg(13, 0, swingB, 3.5, coatDark);   // far front
  leg(-17, 0, swing, 3.5, coatDark);   // far back

  // --- tail, held up and wagging
  ctx.strokeStyle = coat;
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  const wag = Math.sin(t / 90) * 5;
  ctx.beginPath();
  ctx.moveTo(-22, -8);
  ctx.quadraticCurveTo(-30, -13 + wag * 0.4, -34, -21 + wag);
  ctx.stroke();

  // --- body: a long rectangular torso. Real dogs are boxy in profile —
  // flat topline, square chest, square rear, only a slight belly tuck.
  ctx.fillStyle = coat;
  ctx.beginPath();
  ctx.moveTo(19, -11);                       // top of the chest / withers
  ctx.lineTo(-16, -12);                      // flat topline back to the hips
  ctx.quadraticCurveTo(-22, -12, -23, -6);   // squared rear corner
  ctx.lineTo(-23, 2);                        // vertical rear
  ctx.quadraticCurveTo(-22, 5, -15, 5);      // rump underside
  ctx.lineTo(6, 7);                          // belly, deepest under the chest
  ctx.lineTo(18, 6);                         // chest floor
  ctx.quadraticCurveTo(21, 1, 20, -6);       // vertical chest front
  ctx.closePath();
  ctx.fill();

  // shoulder and haunch blocks, a shade darker — gives the box some mass
  ctx.fillStyle = coatDark;
  ctx.globalAlpha = 0.35;
  ctx.beginPath();
  ctx.rect(-20, -8, 9, 12);                  // haunch
  ctx.fill();
  ctx.beginPath();
  ctx.rect(9, -8, 8, 12);                    // shoulder
  ctx.fill();
  ctx.globalAlpha = 1;

  // lit line along the flat topline
  ctx.fillStyle = coat;
  ctx.strokeStyle = coatLit;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(17, -10.5);
  ctx.lineTo(-16, -11.5);
  ctx.stroke();

  // --- neck: short and thick, angled up from the shoulders
  ctx.fillStyle = coat;
  ctx.beginPath();
  ctx.moveTo(13, -11);
  ctx.lineTo(20, -20);
  ctx.lineTo(27, -15);
  ctx.lineTo(19, -6);
  ctx.closePath();
  ctx.fill();

  // --- head
  // skull — blockier than a circle, flat across the top
  ctx.beginPath();
  ctx.moveTo(20, -25);
  ctx.lineTo(30, -24);
  ctx.quadraticCurveTo(33, -23, 33, -19);
  ctx.lineTo(31, -13);
  ctx.lineTo(21, -13);
  ctx.quadraticCurveTo(17, -19, 20, -25);
  ctx.closePath();
  ctx.fill();

  // muzzle — a squared box, not a taper
  ctx.beginPath();
  ctx.moveTo(31, -21);
  ctx.lineTo(41, -20);
  ctx.lineTo(41, -14);
  ctx.lineTo(31, -14);
  ctx.closePath();
  ctx.fill();

  // nose
  ctx.fillStyle = "#14100C";
  ctx.beginPath();
  ctx.roundRect(39, -21, 4, 5, 1.4);
  ctx.fill();

  // eye
  ctx.beginPath();
  ctx.arc(28, -20, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // floppy ear, hanging square off the back of the skull
  ctx.fillStyle = coatDark;
  ctx.beginPath();
  ctx.moveTo(21, -25);
  ctx.lineTo(16, -24);
  ctx.lineTo(15, -12);
  ctx.lineTo(22, -14);
  ctx.closePath();
  ctx.fill();

  // --- near legs, on the opposite phase
  leg(14, 1, swing, 4.5, coat);
  leg(-16, 1, swingB, 4.5, coat);

  // --- birds in the mouth
  dog.carried.forEach((c, k) => {
    const T = DUCKS[typeof c === "object" ? c.t : c];
    ctx.fillStyle = T.body;
    ctx.beginPath();
    ctx.ellipse(44 + k * 2, -14 + k * 5, 11 * T.size, 5 * T.size, 0.35, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = T.head;
    ctx.beginPath();
    ctx.arc(52 + k * 2, -12 + k * 5, 3.4 * T.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.lineCap = "butt";
  ctx.restore();
}

function drawBuck(ctx, b, t) {
  const facing = b.dir >= 0 ? 1 : -1;
  const down = !b.alive;
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(facing, 1);
  if (down) {
    const k = Math.min(1, (b.fallT ?? 0) / 500);
    ctx.rotate(k * 1.35);
    ctx.globalAlpha = 1 - Math.max(0, ((b.fallT ?? 0) - 900) / 500);
  }

  const swing = down ? 0 : Math.sin(b.gait) * 8;
  const swingB = down ? 0 : Math.sin(b.gait + Math.PI) * 8;

  // legs — long and thin, that's the deer read
  ctx.strokeStyle = "#4A3320";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  [[-14, swing], [-10, swingB], [12, swingB], [16, swing]].forEach(([hx, sw]) => {
    ctx.beginPath();
    ctx.moveTo(hx, -6);
    ctx.quadraticCurveTo(hx + sw * 0.4, 6, hx + sw, 22);
    ctx.stroke();
  });

  // body — rectangular, deep chest, high withers
  ctx.fillStyle = BUCK.body;
  ctx.beginPath();
  ctx.moveTo(20, -22);
  ctx.lineTo(-14, -20);
  ctx.quadraticCurveTo(-20, -19, -21, -12);
  ctx.lineTo(-20, -2);
  ctx.lineTo(-12, -1);
  ctx.lineTo(12, -3);
  ctx.lineTo(21, -8);
  ctx.closePath();
  ctx.fill();

  // pale belly and rump patch
  ctx.fillStyle = BUCK.belly;
  ctx.fillRect(-10, -5, 22, 4);
  ctx.beginPath();
  ctx.ellipse(-19, -8, 4, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // neck and head, carried high
  ctx.fillStyle = BUCK.body;
  ctx.beginPath();
  ctx.moveTo(16, -20);
  ctx.lineTo(26, -38);
  ctx.lineTo(33, -36);
  ctx.lineTo(24, -16);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(26, -42);
  ctx.lineTo(38, -40);
  ctx.lineTo(41, -34);
  ctx.lineTo(28, -34);
  ctx.closePath();
  ctx.fill();
  // muzzle
  ctx.beginPath();
  ctx.moveTo(38, -40);
  ctx.lineTo(46, -38);
  ctx.lineTo(46, -34);
  ctx.lineTo(38, -34);
  ctx.closePath();
  ctx.fill();
  // ear
  ctx.fillStyle = "#523venue";
  ctx.fillStyle = "#523A24";
  ctx.beginPath();
  ctx.moveTo(27, -43);
  ctx.lineTo(21, -47);
  ctx.lineTo(24, -39);
  ctx.closePath();
  ctx.fill();

  // the rack — the whole reason he's worth stopping for
  ctx.strokeStyle = BUCK.antler;
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";
  [-1, 1].forEach((side) => {
    const ox = side > 0 ? 32 : 28;
    ctx.beginPath();
    ctx.moveTo(ox, -44);
    ctx.quadraticCurveTo(ox + 9, -58, ox + 2, -66);
    ctx.stroke();
    for (let k = 0; k < 3; k++) {
      const ty = -50 - k * 6;
      ctx.beginPath();
      ctx.moveTo(ox + 6 - k, ty);
      ctx.lineTo(ox + 13 - k * 2, ty - 7);
      ctx.stroke();
    }
  });

  // eye
  ctx.fillStyle = "#100C08";
  ctx.beginPath();
  ctx.arc(33, -38, 1.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineCap = "butt";
  ctx.restore();
}

function drawTurkey(ctx, d, T) {
  const air = !d.onGround;

  // Geometry below was drawn oversized; these bring the silhouette down to
  // roughly 1.5x a mallard. Strutting is compact and tall, flight is broad.
  ctx.scale(air ? 0.85 : 0.5, air ? 0.85 : 0.5);

  if (!air) {
    // --- strutting on the ground ---------------------------------
    const bob = Math.sin(d.strut) * 1.5;

    // vertical fan tail, spread behind like a hand of cards
    for (let f = -5; f <= 5; f++) {
      const a = f * 0.155;
      ctx.save();
      ctx.translate(-13, -6 + bob);
      ctx.rotate(a);
      ctx.fillStyle = f % 2 ? "#3A2F1E" : "#4A3B24";
      ctx.beginPath();
      ctx.ellipse(0, -20, 4.2, 21, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#8A7038";        // pale barred tip
      ctx.beginPath();
      ctx.ellipse(0, -37, 3.6, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // heavy rounded body, sitting low and upright
    ctx.fillStyle = T.body;
    ctx.beginPath();
    ctx.ellipse(0, bob, 17, 15, -0.12, 0, Math.PI * 2);
    ctx.fill();

    // bronze wing bar across the flank
    ctx.fillStyle = T.mark;
    ctx.beginPath();
    ctx.ellipse(-2, 3 + bob, 12, 5.5, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#D8CFB4";          // white wing bars
    ctx.fillRect(-11, 6 + bob, 13, 1.6);
    ctx.fillRect(-10, 9 + bob, 11, 1.4);

    // long neck rising from the chest
    ctx.strokeStyle = "#3E2E22";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(9, -6 + bob);
    ctx.quadraticCurveTo(16, -16 + bob, 14, -25 + bob);
    ctx.stroke();

    // small bare head
    ctx.fillStyle = T.head;
    ctx.beginPath();
    ctx.ellipse(15, -29 + bob, 5.5, 5, 0.2, 0, Math.PI * 2);
    ctx.fill();
    // pale crown
    ctx.fillStyle = "#B8CBD6";
    ctx.beginPath();
    ctx.ellipse(14, -32 + bob, 4, 2.4, 0.1, 0, Math.PI * 2);
    ctx.fill();
    // snood over the bill, and the wattle beneath
    ctx.strokeStyle = "#8A3A34";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(19, -31 + bob);
    ctx.quadraticCurveTo(23, -29 + bob, 22, -24 + bob);
    ctx.stroke();
    ctx.fillStyle = "#8A3A34";
    ctx.beginPath();
    ctx.ellipse(13, -24 + bob, 3.4, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // bill
    ctx.fillStyle = T.bill;
    ctx.beginPath();
    ctx.moveTo(19, -30 + bob);
    ctx.lineTo(25, -28 + bob);
    ctx.lineTo(19, -27 + bob);
    ctx.closePath();
    ctx.fill();

    // beard hanging off the chest
    ctx.strokeStyle = "#171310";
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(10, -1 + bob);
    ctx.lineTo(12, 11 + bob);
    ctx.stroke();

    // thick legs
    ctx.strokeStyle = "#9A6A34";
    ctx.lineWidth = 3;
    const step = Math.sin(d.strut) * 3;
    [[-4, step], [4, -step]].forEach(([lx, sw]) => {
      ctx.beginPath();
      ctx.moveTo(lx, 12);
      ctx.lineTo(lx + sw, 23);
      ctx.stroke();
      ctx.beginPath();       // foot
      ctx.moveTo(lx + sw - 3, 23);
      ctx.lineTo(lx + sw + 4, 23);
      ctx.stroke();
    });
    ctx.lineCap = "butt";
    return;
  }

  // --- in the air ------------------------------------------------
  const flap = Math.sin(d.wing) * 16;

  // trailing tail, closed flat now rather than fanned
  ctx.fillStyle = "#3A2F1E";
  ctx.beginPath();
  ctx.moveTo(-14, -2);
  ctx.lineTo(-34, -8);
  ctx.lineTo(-34, 4);
  ctx.lineTo(-14, 4);
  ctx.closePath();
  ctx.fill();

  // heavy barrel body
  ctx.fillStyle = T.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // neck stretched straight out, head low and forward
  ctx.strokeStyle = "#3E2E22";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(13, -3);
  ctx.lineTo(27, -7);
  ctx.stroke();
  ctx.fillStyle = T.head;
  ctx.beginPath();
  ctx.ellipse(30, -8, 5, 4.5, 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = T.bill;
  ctx.beginPath();
  ctx.moveTo(34, -9);
  ctx.lineTo(40, -7);
  ctx.lineTo(34, -6);
  ctx.closePath();
  ctx.fill();

  // broad slow wings — the giveaway that it isn't a duck
  ctx.fillStyle = "#241D14";
  ctx.beginPath();
  ctx.ellipse(-2, -6 - flap * 0.5, 22, 8, -flap * 0.035, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#5A4A2C";
  ctx.beginPath();
  ctx.ellipse(-4, -5 - flap * 0.5, 16, 4.5, -flap * 0.035, 0, Math.PI * 2);
  ctx.fill();

  // tucked legs
  ctx.strokeStyle = "#9A6A34";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(2, 9);
  ctx.lineTo(-6, 13);
  ctx.stroke();
  ctx.lineCap = "butt";
}

/* Effective stats. A weapon scales the gun tier rather than replacing it,
   so nothing you already bought is wasted when you switch guns. */
function weaponOf(meta) {
  return WEAPONS.find((w) => w.id === (meta.weapon || "pump")) || WEAPONS[0];
}
function skinOf(meta) {
  return SKINS.find((k) => k.id === (meta.skin || "blued")) || SKINS[0];
}
function shellsFor(meta) {
  return Math.max(1, Math.round(GUN[meta.lvl.gun].shells * weaponOf(meta).shellMul));
}
function reloadFor(meta) {
  return Math.max(120, Math.round(GUN[meta.lvl.gun].reload * weaponOf(meta).reloadMul));
}
function spreadFor(meta) {
  return Math.round(CHOKE[meta.lvl.choke ?? 0].bonus * weaponOf(meta).spreadMul);
}
function pelletsFor(meta) {
  return Math.max(1, PELLET[meta.lvl.pellet ?? 0].birds + weaponOf(meta).pelletAdd);
}



function spawnDuck() {
    const s = G;
    const r = META.round;
    const ti = pickDuckType(r, META.ducks || DUCKS.map((_, i) => i === 0), PLACES[META.place ?? 0].id);
    const T = DUCKS[ti];
    const PL = PLACES[META.place ?? 0];
    const fromLeft = Math.random() < 0.5;
    const speed =
      (70 + Math.random() * 55 + r * 9) * T.speedMul * PL.speedMul * (fromLeft ? 1 : -1);
    const [y0, y1] = T.yBand;
    s.ducks.push({
      id: s.nextId++,
      t: ti,
      x: (fromLeft ? -50 : W + 50) + (Math.random() - 0.5) * 90,
      y: y0 + Math.random() * (y1 - y0),
      vx: speed,
      bob: Math.random() * Math.PI * 2,
      bobAmp: (8 + Math.random() * 16) * T.bob,
      alive: true,
      vy: 0,
      wing: Math.random() * Math.PI * 2,
      // ground birds walk until something puts them in the air
      onGround: !!T.ground,
      flushed: false,
      flushIn: 0,   // only the flushing dog puts them in the air
      strut: Math.random() * Math.PI * 2,
    });
  }

function fire(gx, gy) {
    const s = G;
    if (!s || s.over || s.paused) return;
    s.aim = { x: gx, y: gy };
    tryReload(s, META); // reload can complete even if the loop is dead
    if (s.shells <= 0) {
      // A rejected tap MUST produce feedback, or the gun reads as broken.
      s.dry = { x: gx, y: gy, life: 220 };
      Sound.dry();
      return;
    }

    s.shells -= 1;
    s.flash = { x: gx, y: gy, life: 120 };
    Sound.shot();
    s.gun.recoil = 1;
    s.gun.muzzle = 130;
    // eject the spent shell out of the ejection port, not from a point
    // hovering ahead of the receiver — a crossbow has no chamber, so it
    // has nothing to eject
    if (weaponOf(META).art.form !== "crossbow") {
      const a = s.gun.ang;
      const fl = Math.cos(a) < 0 ? -1 : 1;
      const { x: rx, y: ry } = gunToWorld(s, weaponOf(META), EJECT_PORT.x, EJECT_PORT.y);
      const eject = a - (Math.PI / 2) * fl;
      s.parts.push({
        x: rx, y: ry,
        vx: Math.cos(eject) * 120 + 40 * fl,
        vy: Math.sin(eject) * 120 - 70,
        life: 1100, max: 1100, kind: "shell", rot: a,
      });
    }
    if (!REDUCED) s.shake = 6;

    // --- pattern resolution --------------------------------------
    // Choke widens the effective pattern; pellet count caps how many birds
    // a single shell can take if they're inside it together.
    const spread = spreadFor(META);
    const maxBirds = pelletsFor(META);

    // the buck first — one shot, no dog, straight to money
    if (s.buck && s.buck.alive && !s.buck.out && s.buck.appearIn <= 0) {
      const b = s.buck;
      if (Math.hypot(b.x - gx, b.y - gy) < BUCK.hit + spread) {
        b.alive = false;
        b.fallT = 0;
        const paid = Math.round(BUCK.value * PLACES[s.place ?? 0].valueMul * weaponOf(META).valueMul);
        META.money += paid;
        s.buckTaken += 1;
        s.takeValue += paid;
        s.buckFlash = { x: b.x, y: b.y, life: 1500, paid };
        Sound.buck();
        for (let i = 0; i < 18; i++) {
          s.parts.push({
            x: b.x, y: b.y - 10,
            vx: (Math.random() - 0.5) * 110,
            vy: -Math.random() * 70,
            life: 900, max: 1400, kind: "feather", rot: Math.random() * 6,
          });
        }
        return;
      }
    }

    const inPattern = [];
    for (const d of s.ducks) {
      if (!d.alive) continue;
      if (d.onGround) continue;   // no shot at a bird on the ground
      const dist = Math.hypot(d.x - gx, d.y - gy);
      if (dist < DUCKS[d.t ?? 0].hit + spread) inPattern.push({ d, dist });
    }


    inPattern.sort((a, b) => a.dist - b.dist);
    const struck = inPattern.slice(0, maxBirds);

    if (struck.length) {
      Sound.hit();
      for (const { d: hit } of struck) {
        hit.alive = false;
        hit.vy = -30;
        hit.wasFlushed = !!hit.flushed;   // remembered for the payout
        for (let i = 0; i < 14; i++) {
          s.parts.push({
            x: hit.x, y: hit.y,
            vx: (Math.random() - 0.5) * 90,
            vy: -Math.random() * 60,
            life: 900 + Math.random() * 600,
            max: 1400, kind: "feather", rot: Math.random() * 6,
          });
        }
      }
      if (struck.length > 1) {
        s.multi = { n: struck.length, x: gx, y: gy, life: 950 };
        Sound.bank();
      }
    } else {
      s.missed += 1;
      for (let i = 0; i < 5; i++) {
        s.parts.push({
          x: gx, y: gy,
          vx: (Math.random() - 0.5) * 60,
          vy: (Math.random() - 0.5) * 60,
          life: 260, max: 260, kind: "puff", rot: 0,
        });
      }
    }

    if (s.shells <= 0) s.reloadUntil = performance.now() + reloadFor(META);
  }

function step(dt) {
    const s = G;
    const m = META;
    if (!s || s.over) return;

    s.t += dt;
    s.time -= dt;
    s.shake *= 0.86;

    s.frames += 1;
    tryReload(s, m);

    // gun follows the aim point, dips while reloading
    {
      const gun = s.gun;
      const reloading = s.shells <= 0;
      const aim = s.aim || { x: GUN_PIVOT.x - 60, y: 240 };
      let target = Math.atan2(aim.y - GUN_PIVOT.y, aim.x - GUN_PIVOT.x);
      target = clamp(target, GUN_MIN_ANG, GUN_MAX_ANG);
      const k = Math.min(1, dt / 110);
      gun.ang += (target - gun.ang) * k;
      gun.dip += ((reloading ? 1 : 0) - gun.dip) * Math.min(1, dt / 160);
      gun.recoil *= Math.pow(0.86, dt / 16);
      if (gun.recoil < 0.01) gun.recoil = 0;
      if (gun.muzzle > 0) gun.muzzle -= dt;
    }
    if (s.refill > 0) s.refill -= dt;
    if (s.dry) {
      s.dry.life -= dt;
      if (s.dry.life <= 0) s.dry = null;
    }

    // spawn
    s.spawnIn -= dt;
    if (s.spawnIn <= 0) {
      // Birds must arrive fast enough to actually fill the bag you bought.
      // Work backwards from capacity: aim to put ~2.4x the bag on the wing
      // per round, so filling it is possible but demands a good round.
      const cap = BAG[m.lvl.bag ?? 0].cap;
      const PL = PLACES[m.place ?? 0];
      const flock = Math.min(cap >= 120 ? 3 : cap >= 42 ? 2 : 1, PL.flockCap ?? 3);
      // density guard — keeps the frame cheap and the sky readable
      const room = Math.max(0, 72 - s.ducks.length);
      for (let f = 0; f < Math.min(flock, room); f++) spawnDuck();
      const wanted = clamp(cap * 2.4, 40, 500) * (PL.spawnMul ?? 1);
      const avgGap = (ROUND_MS * flock) / wanted;
      // Round difficulty tightens the gap, but only slightly — uncapped it
      // compounded with capacity and buried the top tiers in birds.
      const raw = avgGap / 1.225;
      const base = Math.max(150, raw - Math.min(m.round * 3, raw * 0.12));
      s.spawnIn = base + Math.random() * (base * 0.45);
    }

    // --- turkeys on the ground, and the flush ---------------------
    for (const d of s.ducks) {
      // A bird shot while still on the ground must be released from ground
      // handling, or it falls between this loop (skips the dead) and the
      // flight loop (skips the grounded) and sits there forever.
      if (!d.alive) { d.onGround = false; continue; }
      if (!d.onGround) continue;
      d.strut += dt / 260;
      d.x += (d.vx * dt) / 1000;
      // they just walk; the dog decides when they fly
    }

    // --- the flushing dog -----------------------------------------
    // Hunts the nearest bird still on the ground, flushes everything inside
    // its radius, then catches its breath. Rate of flushing is the whole
    // ceiling on a ridge round, so every tier of this upgrade is felt.
    if (s.flusher) {
      const fl = s.flusher;
      const spec = FLUSHER[m.lvl.flusher ?? 0];
      if (fl.puff > 0) fl.puff -= dt;

      if (fl.state === "rest") {
        fl.restLeft -= dt;
        if (fl.restLeft <= 0) fl.state = "hunt";
      } else {
        let mark = null, md = 1e9;
        for (const d of s.ducks) {
          if (!d.alive || !d.onGround) continue;
          const dd = Math.abs(d.x - fl.x);
          if (dd < md) { md = dd; mark = d; }
        }
        if (mark) {
          const dx = mark.x - fl.x;
          fl.dir = dx >= 0 ? 1 : -1;
          fl.gait += dt / 55;
          if (Math.abs(dx) > spec.radius * 0.55) {
            fl.x += Math.sign(dx) * spec.speed * dt / 1000;
          } else {
            // close enough — put up everything in the radius
            let flushed = 0;
            for (const d of s.ducks) {
              if (d.alive && d.onGround && Math.hypot(d.x - fl.x, d.y - fl.y) < spec.radius) {
                flushBird(s, d);
                flushed++;
              }
            }
            if (flushed) {
              fl.puff = 420;
              fl.state = "rest";
              fl.restLeft = spec.rest;
            }
          }
        } else {
          // nothing to work — drift back toward the middle
          const home = W * 0.5;
          if (Math.abs(fl.x - home) > 6) {
            fl.dir = fl.x < home ? 1 : -1;
            fl.gait += dt / 80;
            fl.x += Math.sign(home - fl.x) * spec.speed * 0.45 * dt / 1000;
          }
        }
      }
      fl.x = clamp(fl.x, 20, W - 20);
    }

    // --- the buck -------------------------------------------------
    if (s.buck && !s.buck.out) {
      const b = s.buck;
      if (b.appearIn > 0) {
        b.appearIn -= dt;
        if (b.appearIn <= 0) {
          b.dir = b.x < 0 ? 1 : -1;
          Sound.buckAppear();
        }
      } else if (b.alive) {
        b.gait += dt / 150;
        const speed = (W + 160) / (BUCK.crossMs / 1000);
        b.x += b.dir * speed * dt / 1000;
        if (b.x < -80 || b.x > W + 80) b.out = true;   // slipped away
      } else {
        b.fallT = (b.fallT ?? 0) + dt;
        if (b.fallT > 1400) b.out = true;
      }
    }

    // ducks
    for (const d of s.ducks) {
      if (d.onGround) continue;              // handled above
      if (d.alive) {
        d.x += (d.vx * dt) / 1000;
        d.bob += dt / 380;
        d.wing += dt / 70;
        if (d.climb > 0) {
          // hard climb straight off the ground, easing out as it levels
          d.y -= (d.climb * dt) / 1000;
          d.climb *= Math.pow(0.985, dt / 16);
          if (d.climb < 12) d.climb = 0;
        }
        d.y += Math.sin(d.bob) * (d.bobAmp * dt) / 1000;
      } else {
        d.vy += (900 * dt) / 1000;
        d.y += (d.vy * dt) / 1000;
        d.x += (d.vx * 0.25 * dt) / 1000;
        if (d.y >= WATER_Y) {
          d.landed = true;
          Sound.splash();
          s.floats.push({
            id: d.id,
            t: d.t ?? 0,
            bonus: d.wasFlushed ? (DUCKS[d.t ?? 0].flushBonus || 1) : 1,
            x: clamp(d.x, 40, W - 40),
            y: WATER_Y,
            life: FLOAT_MS * PLACES[s.place ?? 0].floatMul,
            claimed: false,
            bob: 0,
          });
          for (let i = 0; i < 10; i++) {
            s.parts.push({
              x: d.x, y: WATER_Y,
              vx: (Math.random() - 0.5) * 120,
              vy: -Math.random() * 110,
              life: 500, max: 500, kind: "splash", rot: 0,
            });
          }
        }
      }
    }
    s.ducks = s.ducks.filter((d) => !d.landed && d.x > -90 && d.x < W + 90);

    // floating birds decay — this is what makes dog speed matter
    for (const f of s.floats) {
      f.life -= dt;
      f.bob += dt / 300;
    }
    const expired = s.floats.filter((f) => f.life <= 0);
    if (expired.length) {
      s.lost += expired.length;
      Sound.lost();
      for (const f of expired) {
        for (let i = 0; i < 8; i++) {
          s.parts.push({
            x: f.x, y: WATER_Y, vx: (Math.random() - 0.5) * 60,
            vy: -Math.random() * 40, life: 450, max: 450, kind: "splash", rot: 0,
          });
        }
      }
    }
    s.floats = s.floats.filter((f) => f.life > 0);

    // --- dogs ----------------------------------------------------
    // Each dog works independently and keeps collecting until it's full or
    // the water is clear, then runs the whole load home.
    const bagCap = BAG[m.lvl.bag].cap;
    const homeFor = (i2) => KENNEL.x + i2 * 58;

    s.dogs.forEach((dog, di) => {
      const spec = DOG[m.lvl[di === 0 ? "dog" : "dog2"] ?? 0];
      const speed = spec.speed;
      const capacity = spec.carry;
      const claimNearest = () => {
        const open = s.floats.filter((f) => !f.claimed);
        if (!open.length) return null;
        let pick = open[0], bd = 1e9;
        for (const f of open) {
          const d2 = Math.abs(f.x - dog.x);
          if (d2 < bd) { bd = d2; pick = f; }
        }
        pick.claimed = true;
        return pick.id;
      };

      if (dog.state === "idle") {
        if (s.bagged < bagCap) {
          const id = claimNearest();
          if (id !== null) { dog.targets = [id]; dog.carried = []; dog.state = "out"; }
        }
      } else if (dog.state === "out") {
        const tid = dog.targets[0];
        const tf = s.floats.find((f) => f.id === tid);
        if (!tf) {
          dog.targets = [];
          dog.state = dog.carried.length ? "back" : "idle";
        } else {
          const dx = tf.x - dog.x, dy = WATER_Y + 26 - dog.y;
          const dist = Math.hypot(dx, dy);
          dog.gait += dt / 60;
          if (dist < 8) {
            s.floats = s.floats.filter((f) => f.id !== tid);
            dog.carried.push({ t: tf.t ?? 0, bonus: tf.bonus || 1 });
            dog.targets = [];
            Sound.bark();
            const room = capacity - dog.carried.length;
            const next = room > 0 && s.bagged + dog.carried.length < bagCap ? claimNearest() : null;
            if (next !== null) dog.targets = [next];
            else dog.state = "back";
          } else {
            dog.x += (dx / dist) * speed * dt / 1000;
            dog.y += (dy / dist) * speed * dt / 1000;
          }
        }
      } else if (dog.state === "back") {
        const hx = homeFor(di);
        const dx = hx - dog.x, dy = KENNEL.y - dog.y;
        const dist = Math.hypot(dx, dy);
        dog.gait += dt / 60;
        if (dist < 8) {
          if (dog.carried.length) {
            const mul = PLACES[s.place ?? 0].valueMul * weaponOf(m).valueMul;
            for (const c of dog.carried) {
              const ti = typeof c === "object" ? c.t : c;
              const bonus = typeof c === "object" ? c.bonus : 1;
              s.bagged += 1;
              s.takeValue += Math.round(DUCKS[ti].value * mul * bonus);
              s.byType[ti] = (s.byType[ti] || 0) + 1;
            }
            dog.carried = [];
            Sound.bank();
          }
          dog.state = "idle";
          dog.targets = [];
        } else {
          dog.x += (dx / dist) * speed * dt / 1000;
          dog.y += (dy / dist) * speed * dt / 1000;
        }
      }
    });

    // --- hired hunter --------------------------------------------
    if (s.h2) {
      const h = s.h2;
      const spec = HUNTER2[m.lvl.hunter2 ?? 0];
      h.recoil *= Math.pow(0.86, dt / 16);
      if (h.muzzle > 0) h.muzzle -= dt;
      h.nextShot -= dt;

      let mark = null, md = 1e9;
      for (const d of s.ducks) {
        if (!d.alive) continue;
        const dd = Math.hypot(d.x - h.x, d.y - h.y);
        if (dd < md) { md = dd; mark = d; }
      }
      if (mark) {
        const target = clamp(Math.atan2(mark.y - h.y, mark.x - h.x), -Math.PI * 0.92, -Math.PI * 0.06);
        h.ang += (target - h.ang) * Math.min(1, dt / 140);
      }
      if (h.nextShot <= 0 && mark && s.bagged < bagCap) {
        h.nextShot = spec.every * (0.8 + Math.random() * 0.4);
        h.recoil = 1;
        h.muzzle = 120;
        Sound.shot();
        if (Math.random() < spec.acc) {
          mark.alive = false;
          mark.vy = -30;
          for (let i2 = 0; i2 < 10; i2++) {
            s.parts.push({
              x: mark.x, y: mark.y,
              vx: (Math.random() - 0.5) * 80,
              vy: -Math.random() * 55,
              life: 900, max: 1400, kind: "feather", rot: Math.random() * 6,
            });
          }
        }
      }
    }

    if (s.multi) { s.multi.life -= dt; if (s.multi.life <= 0) s.multi = null; }
    if (s.buckFlash) { s.buckFlash.life -= dt; if (s.buckFlash.life <= 0) s.buckFlash = null; }

    // particles
    for (const p of s.parts) {
      p.life -= dt;
      p.x += (p.vx * dt) / 1000;
      p.y += (p.vy * dt) / 1000;
      p.vy += (p.kind === "feather" ? 90 : 300) * dt / 1000;
      if (p.kind === "feather") p.vx *= 0.985;
      p.rot += dt / 200;
    }
    s.parts = s.parts.filter((p) => p.life > 0);

    if (s.flash) {
      s.flash.life -= dt;
      if (s.flash.life <= 0) s.flash = null;
    }

    // end conditions
    const bagFull = s.bagged >= bagCap;
    if (s.time <= 0 || bagFull) {
      s.over = true;
      const earned = s.takeValue;
      m.money += earned;
      const isBest = s.bagged > (m.best ?? 0);
      if (isBest) m.best = s.bagged;

      // Gold shells are earned, not just bought — the game is never
      // gated behind a purchase.
      let gbEarned = GB.perRound;
      if (bagFull) gbEarned += GB.perFullBag;
      if (s.buckTaken) gbEarned += GB.perBuck * s.buckTaken;
      if (isBest) gbEarned += GB.perBest;
      m.gb = (m.gb || 0) + gbEarned;
      UI.results({
        bagged: s.bagged,
        lost: s.lost,
        missed: s.missed,
        isBest,
        place: s.place ?? 0,
        buckTaken: s.buckTaken || 0,
        gbEarned,
        byType: { ...s.byType },
        earned,
        reason: bagFull ? "Bag full" : "Light's gone",
      });
      UI.wallet();

      track("round_complete", {
        round: m.round, place: s.place ?? 0, bagged: s.bagged,
        isBest, reason: bagFull ? "bag_full" : "time_up",
        earned, buckTaken: s.buckTaken || 0, missed: s.missed, lost: s.lost,
      });
      if (window.posthog) posthog.setPersonProperties({
        best_bag: m.best, money: m.money, unlocked_place: m.place, weapon: m.weapon,
      });

      UI.show("results");
      if (isBest) Sound.best(); else Sound.cash();
      persist();
      if (isBest) Save.submitScore(m.best); // no-op on web; Game Center seam
    }
  }

function draw(ctx) {
    const s = G;
    if (!s) return;
    const sh = s.shake;
    const ox = REDUCED ? 0 : (Math.random() - 0.5) * sh;
    const oy = REDUCED ? 0 : (Math.random() - 0.5) * sh;

    ctx.save();
    ctx.translate(ox, oy);

    // Unconditional full-frame clear. Every layer below is allowed to be
    // place-specific; this one never is. Without it, any branch that fails
    // to cover a region leaves the previous frame smeared underneath.
    ctx.fillStyle = "#0A1119";
    ctx.fillRect(-30, -30, W + 60, H + 60);

    // sky
    const P = PLACES[s.place ?? 0];
    const sky = ctx.createLinearGradient(0, 0, 0, WATER_Y);
    sky.addColorStop(0, P.sky[0]);
    sky.addColorStop(0.55, P.sky[1]);
    sky.addColorStop(0.85, P.sky[2]);
    sky.addColorStop(1, P.sky[3]);
    ctx.fillStyle = sky;
    ctx.fillRect(-20, -20, W + 40, WATER_Y + 20);

    // sun
    ctx.fillStyle = P.sun;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(P.sunF * W, P.sunY, P.sunR, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.16;
    ctx.beginPath();
    ctx.arc(P.sunF * W, P.sunY, P.sunR * 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // --- BANKS (per place, above the waterline) -------------------
    if (P.id === "bayou") {
      // --- MARSH ---
      // back cypress bands, pre-rendered once (they're distant, no sway needed)
      if (BG) ctx.drawImage(BG, 0, 0, W, H);
      // far reed bank: a low ragged wall of grass, not a forest silhouette
      ctx.fillStyle = C.sedgeFar;
      ctx.beginPath();
      ctx.moveTo(0, WATER_Y);
      for (let x = 0; x <= W; x += 6) {
        const h =
          16 +
          Math.sin(x * 0.021) * 7 +
          Math.sin(x * 0.077) * 4 +
          Math.sin(x * 0.31) * 3;
        ctx.lineTo(x, WATER_Y - h);
      }
      ctx.lineTo(W, WATER_Y);
      ctx.closePath();
      ctx.fill();

      // far cattail stalks poking above the bank
      ctx.strokeStyle = C.sedgeFar;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 60; i++) {
        const x = (i * 137) % W;
        const h = 20 + ((i * 53) % 26);
        const sway = Math.sin(s.t / 1400 + i) * 2;
        ctx.beginPath();
        ctx.moveTo(x, WATER_Y - 10);
        ctx.lineTo(x + sway, WATER_Y - 10 - h);
        ctx.stroke();
      }

      // mid bank: a nearer, darker island of sedge with a mud shoulder
      ctx.fillStyle = C.sedgeMid;
      ctx.beginPath();
      ctx.moveTo(0, WATER_Y + 6);
      for (let x = 0; x <= W; x += 5) {
        const island =
          Math.max(0, Math.sin(x * 0.0042 + 1.2)) * 26 +
          Math.max(0, Math.sin(x * 0.0089 + 4.0)) * 18;
        const h = island + Math.sin(x * 0.19) * 2.5;
        ctx.lineTo(x, WATER_Y + 6 - h);
      }
      ctx.lineTo(W, WATER_Y + 6);
      ctx.closePath();
      ctx.fill();

      // mudflat waterline under the mid bank
      ctx.fillStyle = C.mud;
      ctx.globalAlpha = 0.55;
      ctx.beginPath();
      ctx.moveTo(0, WATER_Y + 6);
      for (let x = 0; x <= W; x += 5) {
        const island =
          Math.max(0, Math.sin(x * 0.0042 + 1.2)) * 26 +
          Math.max(0, Math.sin(x * 0.0089 + 4.0)) * 18;
        ctx.lineTo(x, WATER_Y + 6 - Math.min(island, 5));
      }
      ctx.lineTo(W, WATER_Y + 10);
      ctx.lineTo(0, WATER_Y + 10);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;

      // low ground mist sitting on the water — reads as marsh, not lake
      ctx.fillStyle = C.fog;
      ctx.globalAlpha = 0.1;
      for (let i = 0; i < 3; i++) {
        const y = WATER_Y - 18 + i * 14;
        const drift = Math.sin(s.t / (2600 + i * 700) + i) * 40;
        ctx.beginPath();
        ctx.ellipse(W / 2 + drift, y, W * 0.62, 11 - i * 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

    } else if (P.id === "prairie") {
      // Big empty sky country: a low grass horizon, rolling stubble, and
      // absolutely nothing tall. The contrast with the bayou IS the point.
      ctx.fillStyle = "#5A5335";
      ctx.beginPath();
      ctx.moveTo(0, WATER_Y);
      for (let x = 0; x <= W; x += 7) {
