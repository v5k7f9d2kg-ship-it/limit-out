        const h = 10 + Math.sin(x * 0.013) * 6 + Math.sin(x * 0.061) * 3;
        ctx.lineTo(x, WATER_Y - h);
      }
      ctx.lineTo(W, WATER_Y);
      ctx.closePath();
      ctx.fill();
      // wind-bent grass along the bank
      ctx.strokeStyle = "#6B6440";
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 150; k++) {
        const x = (k * 37) % W;
        const h = 8 + ((k * 23) % 16);
        const lean = 5 + Math.sin(s.t / 700 + k * 0.3) * 3; // steady prairie wind
        ctx.beginPath();
        ctx.moveTo(x, WATER_Y - 4);
        ctx.quadraticCurveTo(x + lean * 0.5, WATER_Y - 4 - h * 0.6, x + lean, WATER_Y - 4 - h);
        ctx.stroke();
      }
      // distant pothole ponds catching the light
      ctx.fillStyle = P.accent;
      ctx.globalAlpha = 0.15;
      for (let k = 0; k < 5; k++) {
        ctx.beginPath();
        ctx.ellipse(90 + k * 190, WATER_Y - 16 + (k % 2) * 5, 46 - k * 4, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // a lone fencepost line — the only vertical thing out here
      ctx.strokeStyle = "#3A3524";
      ctx.lineWidth = 2;
      for (let k = 0; k < 9; k++) {
        const x = 60 + k * 104;
        ctx.beginPath();
        ctx.moveTo(x, WATER_Y - 6);
        ctx.lineTo(x, WATER_Y - 26 + k * 0.8);
        ctx.stroke();
      }
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.moveTo(60, WATER_Y - 22);
      ctx.lineTo(60 + 8 * 104, WATER_Y - 15);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (P.id === "ridge") {
      // Hardwood ridge: heavy oak trunks with a leaf canopy overhead.
      // Vertical and enclosed, where the marsh is open and horizontal.
      ctx.fillStyle = "#2A3326";
      ctx.beginPath();
      ctx.moveTo(0, WATER_Y);
      for (let x = 0; x <= W; x += 8) {
        const h = 26 + Math.sin(x * 0.011) * 12 + Math.sin(x * 0.05) * 5;
        ctx.lineTo(x, WATER_Y - h);
      }
      ctx.lineTo(W, WATER_Y);
      ctx.closePath();
      ctx.fill();

      // oak trunks, thick and straight
      for (let k = 0; k < 11; k++) {
        const x = 30 + k * 84 + ((k * 37) % 30);
        const w = 9 + ((k * 13) % 9);
        const top = 30 + ((k * 53) % 90);
        ctx.fillStyle = k % 2 ? "#3A3226" : "#2E281E";
        ctx.beginPath();
        ctx.moveTo(x - w, WATER_Y - 6);
        ctx.lineTo(x - w * 0.65, top);
        ctx.lineTo(x + w * 0.65, top);
        ctx.lineTo(x + w, WATER_Y - 6);
        ctx.closePath();
        ctx.fill();
        // a couple of limbs
        ctx.strokeStyle = k % 2 ? "#3A3226" : "#2E281E";
        ctx.lineWidth = 4;
        for (let b = 0; b < 2; b++) {
          const by = top + 40 + b * 55;
          const dir = (k + b) % 2 ? 1 : -1;
          ctx.beginPath();
          ctx.moveTo(x, by);
          ctx.quadraticCurveTo(x + dir * 26, by - 12, x + dir * 48, by - 26);
          ctx.stroke();
        }
      }

      // canopy of turning oak leaves across the top
      for (let k = 0; k < 90; k++) {
        const cx = (k * 61) % W;
        const cy = 14 + ((k * 43) % 120);
        const tone = ["#6B5A2A", "#7E6430", "#4F4A24", "#8A6A36"][k % 4];
        ctx.fillStyle = tone;
        ctx.globalAlpha = 0.55;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 22 + (k % 4) * 7, 12 + (k % 3) * 5, k * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    } else {
      // Frozen flats: snow bank, bare black scrub, and pressure cracks in
      // the ice. Monochrome and cold — nothing here looks like the bayou.
      ctx.fillStyle = "#DCE6EE";
      ctx.beginPath();
      ctx.moveTo(0, WATER_Y);
      for (let x = 0; x <= W; x += 9) {
        const h = 20 + Math.sin(x * 0.009) * 12 + Math.sin(x * 0.043) * 5;
        ctx.lineTo(x, WATER_Y - h);
      }
      ctx.lineTo(W, WATER_Y);
      ctx.closePath();
      ctx.fill();
      // blue shadow under the drift lip
      ctx.fillStyle = "#A9BECE";
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.moveTo(0, WATER_Y);
      for (let x = 0; x <= W; x += 9) {
        const h = 20 + Math.sin(x * 0.009) * 12 + Math.sin(x * 0.043) * 5;
        ctx.lineTo(x, WATER_Y - Math.min(h, 6));
      }
      ctx.lineTo(W, WATER_Y);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      // bare scrub willows poking through the snow
      ctx.strokeStyle = "#2B333B";
      for (let k = 0; k < 26; k++) {
        const x = (k * 71) % W;
        const h = 14 + ((k * 29) % 30);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, WATER_Y - 12);
        ctx.lineTo(x + 2, WATER_Y - 12 - h);
        ctx.stroke();
        ctx.lineWidth = 1;
        for (let b = 0; b < 3; b++) {
          const by = WATER_Y - 14 - h * (0.4 + b * 0.2);
          const dir = b % 2 ? 1 : -1;
          ctx.beginPath();
          ctx.moveTo(x + 2, by);
          ctx.lineTo(x + 2 + dir * (5 + b * 2), by - 6 - b * 2);
          ctx.stroke();
        }
      }
    }

    // --- WATER (EVERY place) -------------------------------------
    // This must run for all three. It used to live inside the bayou branch,
    // so on prairie and tundra the bottom of the canvas was never repainted
    // and the dog, gun and particles smeared across it.
    const wat = ctx.createLinearGradient(0, WATER_Y, 0, H);
    wat.addColorStop(0, P.water[0]);
    wat.addColorStop(0.5, P.water[1]);
    wat.addColorStop(1, P.water[2]);
    ctx.fillStyle = wat;
    ctx.fillRect(-20, WATER_Y, W + 40, H - WATER_Y + 20);

    // --- IN-WATER DETAIL (per place) -----------------------------
    if (P.id === "bayou") {
      // submerged weed beds — dark blotches under the surface
      ctx.fillStyle = "#1D2A26";
      ctx.globalAlpha = 0.35;
      for (let i = 0; i < 9; i++) {
        const x = (i * 211) % W;
        const y = WATER_Y + 22 + ((i * 67) % 110);
        ctx.beginPath();
        ctx.ellipse(x, y, 60 + ((i * 31) % 50), 9 + ((i * 13) % 7), 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // emergent grass poking through the shallows
      ctx.strokeStyle = C.sedgeNear;
      ctx.lineWidth = 2;
      for (let i = 0; i < 34; i++) {
        const x = (i * 173) % W;
        const y = WATER_Y + 14 + ((i * 91) % 120);
        const h = 12 + ((i * 29) % 20);
        const sway = Math.sin(s.t / 1000 + i) * 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + sway, y - h * 0.6, x + sway * 2.2, y - h);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 4, y);
        ctx.quadraticCurveTo(x + 4 + sway, y - h * 0.4, x + 8 + sway, y - h * 0.7);
        ctx.stroke();
      }

      // middle and front cypress — drawn live so they sway, and short enough
      // in front that they sit below the duck flight band
      drawBand(ctx, BANDS[2], s.t, WATER_Y);
      drawBand(ctx, BANDS[3], s.t, WATER_Y);

      // cypress knees breaking the surface around their bases
      ctx.fillStyle = C.cypressNear;
      for (let i = 0; i < 30; i++) {
        const bx = ((i * 137) % (W + 60)) - 30;
        const by = WATER_Y + 24 + ((i * 43) % 110);
        const kh = 6 + ((i * 19) % 12);
        ctx.beginPath();
        ctx.moveTo(bx - kh * 0.4, by);
        ctx.quadraticCurveTo(bx - kh * 0.15, by - kh, bx, by - kh * 1.15);
        ctx.quadraticCurveTo(bx + kh * 0.2, by - kh * 0.9, bx + kh * 0.45, by);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.22;
        ctx.strokeStyle = C.paper;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.ellipse(bx, by, kh * 0.9, kh * 0.22, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = C.cypressNear;
      }
    } else if (P.id === "tundra") {
      // pressure cracks across the black ice
      ctx.strokeStyle = "#3E5060";
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 1.5;
      for (let k = 0; k < 7; k++) {
        let x = (k * 151) % W, y = WATER_Y + 20 + ((k * 47) % 110);
        ctx.beginPath();
        ctx.moveTo(x, y);
        for (let seg = 0; seg < 5; seg++) {
          x += 40 + Math.random() * 30;
          y += (Math.random() - 0.5) * 18;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      // drifting snow
      ctx.fillStyle = "#FFFFFF";
      ctx.globalAlpha = 0.5;
      for (let k = 0; k < 70; k++) {
        const sx = (k * 173 + s.t * 0.06 * (1 + (k % 3) * 0.4)) % (W + 40) - 20;
        const sy = (k * 97 + s.t * 0.03) % H;
        ctx.beginPath();
        ctx.arc(sx, sy, 1 + (k % 3) * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // shimmer
    if (P.id === "ridge") {
      // fallen leaves on the forest floor
      for (let i = 0; i < 90; i++) {
        const lx = (i * 97) % W;
        const ly = WATER_Y + 8 + ((i * 53) % (H - WATER_Y - 10));
        ctx.fillStyle = ["#5A4A24", "#6E5A2E", "#463A1E", "#7A6234"][i % 4];
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.ellipse(lx, ly, 6, 3, (i % 7) * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    ctx.strokeStyle = P.accent;
    ctx.globalAlpha = P.id === "ridge" ? 0 : 0.13;
    ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const y = WATER_Y + 10 + i * 12;
      const w = 120 - i * 6;
      ctx.beginPath();
      ctx.moveTo(P.sunF * W - w / 2 + Math.sin(s.t / 700 + i) * 12, y);
      ctx.lineTo(P.sunF * W + w / 2 + Math.sin(s.t / 700 + i) * 12, y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // floating birds
    for (const f of s.floats) {
      const FT = DUCKS[f.t ?? 0];
      const fade = f.life < 1800 ? 0.35 + 0.65 * Math.abs(Math.sin(s.t / 110)) : 1;
      ctx.globalAlpha = fade;
      ctx.fillStyle = FT.body;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + Math.sin(f.bob) * 2, 15 * FT.size, 7 * FT.size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = C.paper;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y + 7, 24, 5, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // --- the flushing dog ----------------------------------------
    if (s.flusher) {
      const fl = s.flusher;
      const working = fl.state !== "rest";
      // reuse the dog silhouette, scaled down — a spaniel next to a lab
      ctx.save();
      ctx.translate(fl.x, fl.y);
      ctx.scale(0.82, 0.82);
      ctx.translate(-fl.x, -fl.y);
      drawDog(
        ctx,
        { x: fl.x, y: fl.y, state: fl.dir >= 0 ? "out" : "back", gait: fl.gait, carried: [] },
        "#6A4630", "#40291B", "#8C6242", s.t, working
      );
      ctx.restore();

      // burst of brush and feathers where it just flushed
      if (fl.puff > 0) {
        const a = fl.puff / 420;
        ctx.globalAlpha = a * 0.7;
        ctx.strokeStyle = C.paper;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(fl.x, fl.y - 10, (1 - a) * FLUSHER[META.lvl.flusher ?? 0].radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // --- the buck (behind the birds, out on the bank) -------------
    if (s.buck && !s.buck.out && s.buck.appearIn <= 0) {
      drawBuck(ctx, s.buck, s.t);
    }

    // --- dogs ----------------------------------------------------
    s.dogs.forEach((dog, di) => {
      // first dog is a chesapeake, second a yellow lab
      const coat     = di === 0 ? "#8C4A2A" : "#A8894E";
      const coatDark = di === 0 ? "#5E2F1A" : "#775F33";
      const coatLit  = di === 0 ? "#B06A42" : "#C9AA6E";
      drawDog(ctx, dog, coat, coatDark, coatLit, s.t, dog.state !== "idle");
    });

    // --- hired hunter --------------------------------------------
    // Drawn as a standing figure in profile: legs in the water, tapered
    // torso, shoulders, neck, a capped head, and both arms on the gun.
    if (s.h2) {
      const h = s.h2;
      const coat = "#232C22";
      const coatLit = "#39452F";
      const trouser = "#1A211B";
      const skin = "#8A6A4E";
      const kick = h.recoil;
      const lean = kick * 3; // rocks back on the shot

      ctx.save();
      ctx.translate(h.x + lean, h.y);

      // --- legs, disappearing into the water
      ctx.strokeStyle = trouser;
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();          // back leg
      ctx.moveTo(-2, 16);
      ctx.lineTo(-9, 40);
      ctx.stroke();
      ctx.beginPath();          // front leg, slightly braced forward
      ctx.moveTo(3, 16);
      ctx.lineTo(9, 39);
      ctx.stroke();

      // --- torso: wide at the shoulders, narrow at the waist
      ctx.fillStyle = coat;
      ctx.beginPath();
      ctx.moveTo(-11, -9);      // back shoulder
      ctx.quadraticCurveTo(-13, 2, -7, 18);
      ctx.lineTo(8, 18);
      ctx.quadraticCurveTo(12, 2, 10, -9);
      ctx.quadraticCurveTo(0, -14, -11, -9);
      ctx.closePath();
      ctx.fill();

      // shoulder line catching the light
      ctx.strokeStyle = coatLit;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-10, -9);
      ctx.quadraticCurveTo(0, -13, 9, -9);
      ctx.stroke();

      // --- neck and head
      ctx.fillStyle = skin;
      ctx.fillRect(0, -20, 5, 8);
      ctx.beginPath();
      ctx.ellipse(3, -25, 7, 7.5, 0.12, 0, Math.PI * 2);
      ctx.fill();
      // jaw shadow so the head reads as facing right
      ctx.fillStyle = "#6E5340";
      ctx.beginPath();
      ctx.ellipse(6, -22, 3.5, 3, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // --- cap with a forward brim
      ctx.fillStyle = "#161C15";
      ctx.beginPath();
      ctx.ellipse(2, -30, 8, 5.5, 0.05, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();          // brim
      ctx.ellipse(11, -29, 7, 2.2, 0.08, 0, Math.PI * 2);
      ctx.fill();

      // --- back arm, bent to the trigger
      ctx.strokeStyle = coat;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-6, -5);
      ctx.quadraticCurveTo(-10, 3, -3, 6);
      ctx.stroke();

      // --- gun and forward arm, both rotating with the aim
      ctx.save();
      ctx.rotate(h.ang + kick * 0.16);
      ctx.translate(-kick * 8, 0);

      ctx.strokeStyle = "#A87A4E";   // stock
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(-30, -6);
      ctx.lineTo(-8, -8);
      ctx.stroke();

      ctx.strokeStyle = "#2A333B";   // barrel
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-14, -8);
      ctx.lineTo(74, -8);
      ctx.stroke();

      // forward arm reaching along the forend — this is what sells "holding"
      ctx.strokeStyle = coat;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(2, 2);
      ctx.quadraticCurveTo(18, 4, 30, -4);
      ctx.stroke();
      ctx.fillStyle = skin;          // hand on the forend
      ctx.beginPath();
      ctx.arc(32, -5, 3.4, 0, Math.PI * 2);
      ctx.fill();

      if (h.muzzle > 0) {
        const a = h.muzzle / 120;
        ctx.globalAlpha = a;
        ctx.fillStyle = C.paper;
        ctx.beginPath();
        ctx.moveTo(74, -8);
        ctx.lineTo(74 + 30 * a, -8 - 12 * a);
        ctx.lineTo(74 + 42 * a, -8);
        ctx.lineTo(74 + 30 * a, -8 + 12 * a);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      ctx.lineCap = "butt";
      ctx.restore();

      // ripple where he's standing in the water
      ctx.strokeStyle = C.paper;
      ctx.globalAlpha = 0.18;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(h.x, h.y + 38, 17, 4, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // ducks
    for (const d of s.ducks) {
      const T = DUCKS[d.t ?? 0];
      const face = d.vx > 0 ? 1 : -1;
      const z = T.size;
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.scale(face * z, z);
      if (!d.alive) ctx.rotate(0.7);

      // turkeys are drawn from scratch — nothing about a duck body fits
      if (T.ground) {
        drawTurkey(ctx, d, T);
        ctx.restore();
        continue;
      }

      // long tail feathers (pintail)
      if (T.tail) {
        ctx.strokeStyle = T.body;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-16, 0);
        ctx.lineTo(-16 - T.tail, d.alive ? -3 : 2);
        ctx.stroke();
      }

      ctx.fillStyle = T.body;
      ctx.beginPath();
      ctx.ellipse(0, 0, 19, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // head
      ctx.fillStyle = T.head;
      ctx.beginPath();
      ctx.ellipse(15, -9, 8, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // species marking
      if (T.mark) {
        ctx.fillStyle = T.mark;
        if (T.name === "Teal") {
          // facial crescent
          ctx.beginPath();
          ctx.ellipse(17, -10, 2.4, 4, 0.3, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // neck stripe
          ctx.fillRect(9, -10, 2.5, 9);
        }
      }

      // bill
      ctx.beginPath();
      ctx.moveTo(21, -9);
      ctx.lineTo(31, -6);
      ctx.lineTo(21, -3);
      ctx.closePath();
      ctx.fillStyle = T.bill;
      ctx.fill();

      // wing
      ctx.fillStyle = "#1E2A36";
      const flap = d.alive ? Math.sin(d.wing) * 14 : 10;
      ctx.beginPath();
      ctx.ellipse(-3, -4 - flap * 0.4, 13, 6, -flap * 0.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // particles
    for (const p of s.parts) {
      const a = p.life / p.max;
      ctx.globalAlpha = clamp(a, 0, 1);
      if (p.kind === "feather") {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = C.paper;
        ctx.beginPath();
        ctx.ellipse(0, 0, 5, 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (p.kind === "shell") {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = "#B8863A";
        ctx.fillRect(-11, -4.5, 22, 9);
        ctx.fillStyle = "#8C1F1F";
        ctx.fillRect(-11, -4.5, 8, 9);
        ctx.restore();
      } else if (p.kind === "splash") {
        ctx.fillStyle = C.waterLit;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * a + 1, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = C.fog;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6 * (1 - a) + 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // --- FOREGROUND (per place) ----------------------------------
    if (P.id === "bayou") {
      // foreground cattails — the frame that sells "marsh"
      for (let i = 0; i < 40; i++) {
        const x = (i * 47) % (W + 40) - 20;
        const near = i % 3 === 0;
        const h = (near ? 95 : 58) + ((i * 37) % 70);
        const sway = Math.sin(s.t / 900 + i * 0.7) * (near ? 8 : 5);
        ctx.strokeStyle = near ? C.sedgeNear : C.reed;
        ctx.lineWidth = near ? 4 : 2.5;
        // stalk
        ctx.beginPath();
        ctx.moveTo(x, H + 6);
        ctx.quadraticCurveTo(x + sway, H - h * 0.55, x + sway * 2, H - h);
        ctx.stroke();
        // seed head on some
        if (i % 4 === 0) {
          ctx.fillStyle = C.cattail;
          ctx.beginPath();
          ctx.ellipse(x + sway * 2, H - h - 9, near ? 4.5 : 3.5, near ? 15 : 11, sway * 0.02, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = near ? C.sedgeNear : C.reed;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(x + sway * 2, H - h - 24);
          ctx.lineTo(x + sway * 2 + 1, H - h - 34);
          ctx.stroke();
        } else {
          // arching blade
          ctx.lineWidth = near ? 3 : 2;
          ctx.beginPath();
          ctx.moveTo(x + sway * 2, H - h);
          ctx.quadraticCurveTo(x + sway * 2 + 16, H - h - 12, x + sway * 2 + 34, H - h + 10);
          ctx.stroke();
        }
      }
    } else if (P.id === "ridge") {
      // low brush and saplings framing the bottom
      for (let k = 0; k < 46; k++) {
        const x = (k * 41) % (W + 30) - 15;
        const h = 34 + ((k * 47) % 66);
        const sway = Math.sin(s.t / 1100 + k) * 3;
        ctx.strokeStyle = k % 3 === 0 ? "#1E2418" : "#2A3222";
        ctx.lineWidth = k % 3 === 0 ? 4 : 2.4;
        ctx.beginPath();
        ctx.moveTo(x, H + 6);
        ctx.quadraticCurveTo(x + sway, H - h * 0.5, x + sway * 2, H - h);
        ctx.stroke();
        ctx.fillStyle = "#4A4A28";
        for (let lf = 0; lf < 3; lf++) {
          ctx.beginPath();
          ctx.ellipse(x + sway * 2 + (lf - 1) * 7, H - h + lf * 9, 6, 3.4, lf * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else if (P.id === "prairie") {
      ctx.strokeStyle = "#2E2A18";
      for (let k = 0; k < 70; k++) {
        const x = (k * 29) % (W + 30) - 15;
        const h = 40 + ((k * 41) % 70);
        const lean = 12 + Math.sin(s.t / 640 + k * 0.4) * 7;
        ctx.lineWidth = k % 3 === 0 ? 3 : 1.8;
        ctx.beginPath();
        ctx.moveTo(x, H + 6);
        ctx.quadraticCurveTo(x + lean * 0.4, H - h * 0.55, x + lean, H - h);
        ctx.stroke();
        if (k % 5 === 0) {
          ctx.fillStyle = "#4A4228";
          ctx.beginPath();
          ctx.ellipse(x + lean, H - h - 4, 2.5, 7, lean * 0.02, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    } else {
      // snow ridge across the bottom, with a few frozen stalks
      ctx.fillStyle = "#E8F0F6";
      ctx.beginPath();
      ctx.moveTo(0, H + 10);
      for (let x = 0; x <= W; x += 12) {
        ctx.lineTo(x, H - 26 - Math.sin(x * 0.011) * 14 - Math.sin(x * 0.05) * 5);
      }
      ctx.lineTo(W, H + 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#33414D";
      ctx.lineWidth = 2;
      for (let k = 0; k < 22; k++) {
        const x = (k * 83) % W;
        const h = 26 + ((k * 37) % 40);
        const lean = Math.sin(s.t / 900 + k) * 3;
        ctx.beginPath();
        ctx.moveTo(x, H - 30);
        ctx.quadraticCurveTo(x + lean, H - 30 - h * 0.6, x + lean * 1.8, H - 30 - h);
        ctx.stroke();
      }
    }

    // buck payout, floating up from where he dropped
    if (s.buckFlash) {
      const a = clamp(s.buckFlash.life / 1500, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = C.amber;
      ctx.font = "bold 26px Georgia, serif";
      ctx.textAlign = "center";
      ctx.fillText(`+$${s.buckFlash.paid}`, s.buckFlash.x, s.buckFlash.y - 60 - (1 - a) * 40);
      ctx.font = "12px ui-monospace, Menlo, monospace";
      ctx.fillText("BUCK DOWN", s.buckFlash.x, s.buckFlash.y - 40 - (1 - a) * 40);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;
    }

    // multi-kill marker
    if (s.multi) {
      const a = clamp(s.multi.life / 950, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = C.paper;
      ctx.font = "bold 20px Georgia, serif";
      ctx.textAlign = "center";
      ctx.fillText(`×${s.multi.n}`, s.multi.x, s.multi.y - 34 - (1 - a) * 26);
      ctx.textAlign = "left";
      ctx.globalAlpha = 1;
    }

    // the gun, in front of everything in the scene
    {
      const total = reloadFor(META);
      const prog = s.shells <= 0
        ? clamp(1 - (s.reloadUntil - performance.now()) / total, 0, 1)
        : 0;
      drawGun(ctx, s, prog, weaponOf(META), skinOf(META));
    }

    // reload ring — put the state where the eye already is, not in a corner
    if (s.shells <= 0 && s.aim) {
      const total = reloadFor(META);
      const prog = clamp(1 - (s.reloadUntil - performance.now()) / total, 0, 1);
      ctx.strokeStyle = "#2E4658";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(s.aim.x, s.aim.y, 26, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = C.amber;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(s.aim.x, s.aim.y, 26, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
      ctx.stroke();
      ctx.lineCap = "butt";
    }

    // refill pop — the "chunk" moment
    if (s.refill > 0 && s.aim) {
      const a = s.refill / 320;
      ctx.globalAlpha = a;
      ctx.strokeStyle = C.paper;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.aim.x, s.aim.y, 26 + (1 - a) * 24, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // dry click
    if (s.dry) {
      const a = s.dry.life / 220;
      const r = 9 + (1 - a) * 6;
      ctx.globalAlpha = a * 0.85;
      ctx.strokeStyle = "#8FA2B2";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(s.dry.x - r, s.dry.y - r); ctx.lineTo(s.dry.x + r, s.dry.y + r);
      ctx.moveTo(s.dry.x + r, s.dry.y - r); ctx.lineTo(s.dry.x - r, s.dry.y + r);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // muzzle flash
    if (s.flash) {
      const a = s.flash.life / 120;
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = C.paper;
      ctx.beginPath();
      ctx.arc(s.flash.x, s.flash.y, 26 * (1 - a) + 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = a * 0.5;
      ctx.strokeStyle = C.amber;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(s.flash.x, s.flash.y, 34 * (1 - a) + 10, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

</script>

<script>
/* ------------------------------------------------------------------
   Vanilla UI controller.

   Manifest V3 forbids remote code, so the extension can't load React from
   a CDN. The game core (simulation + canvas rendering) is unchanged; only
   the menus and HUD are rebuilt here as plain DOM.
------------------------------------------------------------------ */

let META = newGame();
let G = null;
let BG = null;
let REDUCED = false;
let RAF = 0;
let CANVAS = null;
let CTX = null;
let DPR = 1;
let SUMMARY = null;
let SCREEN = "title";
let SAVED = null;
let CODE = "";
let CODE_NOTE = "";
let GRANT_NOTICE = 0;   // shells just restored, shown once on the brief screen

const el = (tag, style, text) => {
  const n = document.createElement(tag);
  if (style) Object.assign(n.style, style);
  if (text !== undefined) n.textContent = text;
  return n;
};

const MONO = "ui-monospace, 'SF Mono', Menlo, monospace";

/* Phone browsers get a much tighter layout: the chrome that looks
   comfortable on a laptop eats most of a 380px screen. */
const isNarrow = () => (window.innerWidth || 900) < 640;
const isPortrait = () =>
  (window.innerHeight || 560) > (window.innerWidth || 900);
const sz = (big, small) => (isNarrow() ? small : big);
const SERIF = "Georgia, 'Iowan Old Style', serif";

const btnStyle = (variant) => ({
  background: variant === "ghost" ? "transparent" : C.amber,
  color: variant === "ghost" ? "#9DAEBC" : "#1A1207",
  border: variant === "ghost" ? "1px solid #2B3D4E" : "none",
  padding: sz("12px 22px", "13px 18px"),
  minHeight: "46px",
  fontSize: sz("14px", "13px"),
  letterSpacing: "0.14em",
  textTransform: "uppercase",
  fontFamily: MONO,
  cursor: "pointer",
  borderRadius: "2px",
  fontWeight: variant === "ghost" ? "400" : "700",
});

const rowStyle = {
  display: "flex",
  justifyContent: "space-between",
  alignItems: "center",
  padding: "13px 0",
  borderBottom: "1px solid #1E2E3E",
  gap: "12px",
};

/* ---------------- persistence ---------------- */

persist = async function () {
  const ok = await Save.write(META);
  SAVED = await Save.load();
  UI.note(ok ? "Saved" : "Saved for this session");
};

/* ---------------- the UI object the core calls ---------------- */

UI = {
  noteTimer: 0,

  note(text) {
    const n = document.getElementById("saveNote");
    if (!n) return;
    n.textContent = text;
    clearTimeout(this.noteTimer);
    this.noteTimer = setTimeout(() => { n.textContent = ""; }, 2200);
  },

  wallet() {
    const w = document.getElementById("wallet");
    if (w) w.textContent = `$${META.money}`;
    const g = document.getElementById("shells");
    if (g) g.textContent = `◆${META.gb || 0}`;
  },

  results(data) {
    SUMMARY = data;
  },

  show(name) {
    SCREEN = name;
    render();
  },
};

/* ---------------- game loop ---------------- */

function startLoop() {
  cancelAnimationFrame(RAF);
  let last = performance.now();
  const tick = (now) => {
    RAF = requestAnimationFrame(tick);
    const dt = Math.min(Math.max(now - last, 0), 50);
    last = now;
    try {
      if (!CTX) return;                 // canvas not ready yet this frame
      if (G && G.paused) {
        if (G.shells <= 0 && G.reloadUntil > 0) G.reloadUntil += dt;
        draw(CTX);
      } else {
        step(dt);
        draw(CTX);
      }
    } catch (err) {
      console.error("Frame error:", err);
    }
    if (G && G.over) {
      cancelAnimationFrame(RAF);
      persist();
      if (SUMMARY && SUMMARY.isBest) Sound.best(); else Sound.cash();
    }
    syncHud();
  };
  RAF = requestAnimationFrame(tick);
}

function syncHud() {
  if (SCREEN !== "playing" || !G) return;
  const shellsEl = document.getElementById("hudShells");
  const bagEl = document.getElementById("hudBag");
  const timeEl = document.getElementById("hudTime");
  if (!shellsEl) return;
  const cap = GUN[META.lvl.gun].shells;
  let pips = "";
  for (let i = 0; i < Math.min(cap, 14); i++) pips += i < G.shells ? "▮" : "▯";
  shellsEl.textContent = pips + (G.shells <= 0 ? "  RELOADING" : "");
  shellsEl.style.color = G.shells <= 0 ? C.rust : C.amber;
  bagEl.textContent = `BAG ${G.bagged}/${BAG[META.lvl.bag].cap}`;
  const secs = Math.max(0, Math.ceil(G.time / 1000));
  timeEl.textContent = `${secs}s`;
  timeEl.style.color = secs <= 10 ? C.rust : C.paper;
}

function startRound() {
  G = newRound(META);
  SCREEN = "playing";
  render();               // attaches the persistent canvas
  initCanvasBitmap();     // sizes the world, the bitmap and the backdrop
  startLoop();
  track("round_start", { round: META.round, place: META.place, weapon: META.weapon });
}

function setPause(v) {
  if (!G || G.over) return;
  G.paused = v;
  render();
}

/* ---------------- screens ---------------- */

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";

  const landscapePlay = (window.innerHeight || 560) <= 500 &&
                        (window.innerWidth || 900) > (window.innerHeight || 560) &&
                        SCREEN === "playing";

  const shell = el("div", {
    minHeight: "100%", display: "flex", alignItems: "center",
    justifyContent: "center",
    padding: landscapePlay ? "2px" : sz("16px", "8px"),
    paddingBottom: sz("16px", "max(8px, env(safe-area-inset-bottom))"),
    boxSizing: "border-box",
  });
  const wrap = el("div", { width: "100%", maxWidth: "900px" });

  // header
  const landscapePhone = (window.innerHeight || 560) <= 500 &&
                         (window.innerWidth || 900) > (window.innerHeight || 560);

  const head = el("div", {
    display: "flex", justifyContent: "space-between",
    alignItems: "baseline", marginBottom: sz("10px", "6px"),
    gap: sz("12px", "8px"), flexWrap: "wrap",
  });
  const titleBox = el("div");
  titleBox.appendChild(el("div", {
    fontSize: sz("22px", "16px"), letterSpacing: sz("0.3em", "0.18em"),
    textTransform: "uppercase", color: C.paper, fontFamily: SERIF,
  }, "Limit Out"));
  if (!isNarrow()) {
    titleBox.appendChild(el("div", {
      fontFamily: MONO, fontSize: "10px", letterSpacing: "0.22em",
      color: "#5E7080", marginTop: "3px",
    }, "Duck hunting arcade"));
  }
  head.appendChild(titleBox);

  const meta = el("div", {
    fontFamily: MONO, fontSize: sz("13px", "12px"), color: C.amber,
    display: "flex", alignItems: "center", gap: sz("10px", "7px"),
    flexWrap: "wrap",
  });
  const note = el("span", { color: "#6E8496" });
  note.id = "saveNote";
  meta.appendChild(note);
  const where = el("span", {
    color: window.storageInfo && window.storageInfo.mode === "account" ? "#7FA88C" : "#5E7080",
    fontSize: "11px",
  }, window.storageInfo ? (window.storageInfo.mode === "account" ? "☁ account" : "▪ device") : "");
  where.title = window.storageInfo ? window.storageInfo.label() : "";
  meta.appendChild(where);
  const wallet = el("span", {}, `$${META.money}`);
  wallet.id = "wallet";
  meta.appendChild(wallet);
  const shells = el("span", { color: "#C9A227" }, `◆${META.gb || 0}`);
  shells.id = "shells";
  meta.appendChild(shells);
  meta.appendChild(el("span", { color: "#5E7080" }, `Round ${META.round}`));
  const mute = el("button", {
    background: "transparent", border: "1px solid #2B3D4E", borderRadius: "2px",
    color: Sound.muted ? "#5E7080" : C.amber, cursor: "pointer",
    fontFamily: MONO, fontSize: "12px", padding: "4px 9px",
  }, Sound.muted ? "♪ off" : "♪ on");
  mute.onclick = () => {
    Sound.resume();
    Sound.setMuted(!Sound.muted);
    STORE.set("limitout:muted", Sound.muted ? "1" : "0");
    render();
  };
  meta.appendChild(mute);
  head.appendChild(meta);
  // in landscape the in-canvas HUD already shows everything that matters
  if (!(landscapePhone && SCREEN === "playing")) wrap.appendChild(head);

  wrap.appendChild(screenFor(SCREEN));
  shell.appendChild(wrap);
  root.appendChild(shell);
}

function panel(children) {
  const p = el("div", {
    border: "1px solid #26374A", background: "rgba(20,31,46,0.6)",
    padding: sz("26px 24px", "16px 14px"), borderRadius: "3px",
    color: C.paper, fontFamily: SERIF,
    maxHeight: isNarrow() ? "82dvh" : "none",
    overflowY: isNarrow() ? "auto" : "visible",
    WebkitOverflowScrolling: "touch",
  });
  children.forEach((c) => p.appendChild(c));
  return p;
}

function heading(text) {
  return el("div", {
    fontFamily: MONO, fontSize: "12px", letterSpacing: "0.2em",
    color: C.amber, margin: "22px 0 6px",
  }, text);
}

function screenFor(name) {
  if (name === "title") return titleScreen();
  if (name === "naming") return namingScreen();
  if (name === "brief") return briefScreen();
  if (name === "shop") return shopScreen();
  if (name === "results") return resultsScreen();
  return playScreen();
}

function titleScreen() {
  const kids = [];
  kids.push(el("p", {
    lineHeight: "1.65", fontSize: "16px", margin: "0 0 20px", color: C.paper,
  }, "Dawn on the marsh. Tap a duck to shoot it — but you only carry a few shells, and reloading costs you time. Your dog fetches what falls, and a bird left floating too long is gone. Fill the bag, sell the take, buy better gear."));

  const bar = el("div", { display: "flex", gap: "10px", flexWrap: "wrap" });
  if (SAVED) {
    const card = el("div", {
      border: "1px solid #2B3D4E", padding: "11px 13px", marginBottom: "14px",
      fontFamily: MONO, fontSize: "13px", color: "#9DAEBC",
    }, `${SAVED.hunter} & ${SAVED.dogName} · Round ${SAVED.round} · $${SAVED.money}${SAVED.best ? ` · best ${SAVED.best}` : ""}`);
    kids.push(card);
    const cont = el("button", btnStyle(), "Continue");
    cont.onclick = () => {
      loadInto(SAVED);
      UI.show("brief");
    };
    bar.appendChild(cont);
    const fresh = el("button", btnStyle("ghost"), "New hunt");
    fresh.onclick = async () => {
      await Save.clear();
      META = newGame();
      SAVED = null;
      UI.show("title");
    };
    bar.appendChild(fresh);
  } else {
    const begin = el("button", btnStyle(), "Begin");
    begin.onclick = () => UI.show("naming");
    bar.appendChild(begin);
  }
  kids.push(bar);
  kids.push(transferPanel());
  return panel(kids);
}

function namingScreen() {
  const kids = [];
  kids.push(el("div", {
    fontFamily: MONO, fontSize: "12px", letterSpacing: "0.2em",
    color: C.amber, marginBottom: "18px",
  }, "BEFORE FIRST LIGHT"));

  const field = (label, value, onInput) => {
    const box = el("div", { marginBottom: "16px" });
    box.appendChild(el("div", {
      fontFamily: MONO, fontSize: "11px", letterSpacing: "0.16em",
      color: "#7C8B9A", marginBottom: "6px",
    }, label));
    const inp = el("input");
    Object.assign(inp.style, {
      width: "100%", boxSizing: "border-box", background: "#0E1822",
      border: "1px solid #2B3D4E", color: C.paper, padding: "11px 13px",
      fontSize: "16px", fontFamily: SERIF, borderRadius: "2px", outline: "none",
    });
    inp.value = value;
    inp.maxLength = 16;
    inp.oninput = (e) => onInput(e.target.value);
    box.appendChild(inp);
    return box;
  };

  let h = META.hunter, d = META.dogName;
  kids.push(field("YOUR NAME", h, (v) => { h = v; }));
  kids.push(field("YOUR DOG'S NAME", d, (v) => { d = v; }));
  kids.push(el("p", {
    fontSize: "14px", color: "#7C8B9A", lineHeight: "1.6", margin: "6px 0 20px",
  }, "A good retriever is half the hunt. Pick a name you'll be shouting across the water for a long while."));

  const bar = el("div", { display: "flex", gap: "10px" });
  const go = el("button", btnStyle(), "Head out");
  go.onclick = () => {
    META.hunter = (h.trim() || "Hunter").slice(0, 16);
    META.dogName = (d.trim() || "Scout").slice(0, 16);
    persist();
    UI.show("brief");
  };
  bar.appendChild(go);
  const back = el("button", btnStyle("ghost"), "Back");
  back.onclick = () => UI.show("title");
  bar.appendChild(back);
  kids.push(bar);
  return panel(kids);
}

function briefScreen() {
  const kids = [];
  kids.push(el("div", { fontSize: "19px", marginBottom: "6px" },
    `${META.hunter} & ${META.dogName}`));
  kids.push(el("div", {
    fontFamily: MONO, fontSize: "13px", color: "#7C8B9A", marginBottom: "6px",
  }, `Round ${META.round} · $${META.money}${META.best ? ` · best bag ${META.best}` : ""}`));
  kids.push(el("div", {
    fontFamily: MONO, fontSize: "12px", color: PLACES[META.place].accent, marginBottom: "4px",
  }, PLACES[META.place].name));
  kids.push(el("div", {
    fontFamily: MONO, fontSize: "11px", color: "#6E8496", marginBottom: "16px",
  }, [
    `bag ${BAG[META.lvl.bag].cap}`,
    `${PELLET[META.lvl.pellet].birds}/shell`,
    (WEAPONS.find((w) => w.id === (META.weapon || "pump")) || WEAPONS[0]).name,
    META.hired.dog2 ? "2 dogs" : "1 dog",
    META.hired.hunter2 ? "+ hired gun" : null,
  ].filter(Boolean).join(" · ")));

  if (GRANT_NOTICE) {
    const box = el("div", {
      border: "1px solid #6B5A1E", background: "rgba(201,162,39,0.10)",
      borderRadius: "2px", padding: "12px 14px", marginBottom: "14px",
    });
    box.appendChild(el("div", {
      fontFamily: MONO, fontSize: "12px", letterSpacing: "0.14em",
      color: "#C9A227", marginBottom: "6px",
    }, `◆ ${GRANT_NOTICE} GOLD SHELLS RESTORED`));
    box.appendChild(el("div", {
      fontSize: "13px", color: "#9DAEBC", lineHeight: "1.5",
    }, GRANT.note));
    const ok = el("button", {
      ...btnStyle("ghost"), marginTop: "10px", padding: "9px 16px",
      fontSize: "12px", minHeight: "40px",
    }, "Thanks");
    ok.onclick = () => { GRANT_NOTICE = 0; render(); };
    box.appendChild(ok);
    kids.push(box);
  }

  kids.push(heading("ON THE WING"));
  DUCKS.forEach((d, i) => {
    const offered = META.round >= d.unlock;
    const own = META.ducks[i];
    const row = el("div", { ...rowStyle, opacity: own ? "1" : offered ? "0.75" : "0.42" });
    const left = el("div", { display: "flex", alignItems: "center", gap: "10px" });
    left.appendChild(el("span", {
      width: "16px", height: "10px", borderRadius: "50%",
      background: own ? d.body : "#1E2E3E",
      border: `1px solid ${own ? d.head : "#2B3D4E"}`,
      display: "inline-block", flexShrink: "0",
    }));
    const info = el("div");
    info.appendChild(el("div", { fontSize: "15px" }, offered ? d.name : "????"));
    info.appendChild(el("div", {
      fontFamily: MONO, fontSize: "11px", color: "#7C8B9A", marginTop: "2px",
    }, own ? d.note : offered ? `Available in the Outfitter — $${d.cost}` : `Offered at round ${d.unlock}`));
    left.appendChild(info);
    row.appendChild(left);
    row.appendChild(el("div", {
      fontFamily: MONO, fontSize: "13px", color: own ? C.amber : "#4A5766",
    }, own ? `$${d.value}` : offered ? "not owned" : "—"));
    kids.push(row);
  });

  const bar = el("div", { display: "flex", gap: "10px", flexWrap: "wrap", marginTop: "20px" });
  const go = el("button", btnStyle(), "Start round");
  go.onclick = () => startRound();
  bar.appendChild(go);
  const shop = el("button", btnStyle("ghost"), "Outfitter");
  shop.onclick = () => UI.show("shop");
  bar.appendChild(shop);
  const save = el("button", btnStyle("ghost"), "Save");
  save.onclick = () => persist();
  bar.appendChild(save);
  const home = el("button", btnStyle("ghost"), "Title");
  home.onclick = () => UI.show("title");
  bar.appendChild(home);

/* Create the canvas element ONCE and keep it. Rebuilding it on every render
   was the black-screen bug: pausing re-renders, which made a fresh canvas
   with no bitmap size while CTX still pointed at the old detached one, so
   after Resume the game was drawing into an element nobody could see. */
function makeCanvas() {
  const cv = el("canvas");
  Object.assign(cv.style, {
    display: "block",
    margin: "0 auto",
    borderRadius: "3px",
    touchAction: "none", cursor: "crosshair", border: "1px solid #26374A",
  });
  sizeCanvasToViewport(cv);
  cv.onpointerdown = (e) => {
    const r = cv.getBoundingClientRect();
    Sound.resume();
    fire(((e.clientX - r.left) * W) / r.width, ((e.clientY - r.top) * H) / r.height);
  };
  cv.onpointermove = (e) => {
    if (!G) return;
    const r = cv.getBoundingClientRect();
    G.aim = {
      x: ((e.clientX - r.left) * W) / r.width,
      y: ((e.clientY - r.top) * H) / r.height,
    };
  };
  CANVAS = cv;
  return cv;
}

/* Fit the canvas to the screen.

   The world itself reshapes to the device (see setWorldWidth in the core),
   so on a modern phone the aspect already matches and this ends up using
   essentially the whole screen. Anything left over is a rounding remainder,
   not a black bar. */
function sizeCanvasToViewport(cv) {
  const vw = window.innerWidth || 900;
  const vh = window.innerHeight || 560;
  const landscapePhone = vh <= 560 && vw > vh;

  const padX = landscapePhone ? 0 : isNarrow() ? 8 : 16;
  const chromeY = landscapePhone ? 0 : isNarrow() ? 58 : 86;

  const availW = vw - padX * 2;
  const availH = vh - chromeY;

  // reshape the world to the space available, then fit inside it
  if (landscapePhone || isNarrow()) {
    const changed = setWorldWidth(worldWidthFor(availW, availH));
    if (changed) BG = null;   // cached scenery was drawn at the old width
  }

  let w = availW;
  let h = (w * H) / W;
  if (h > availH) {
    h = availH;
    w = (h * W) / H;
  }

  cv.style.width = Math.floor(w) + "px";
  cv.style.height = Math.floor(h) + "px";
  cv.style.maxWidth = "100%";
  cv.style.border = landscapePhone ? "none" : "1px solid #26374A";
  cv.style.borderRadius = landscapePhone ? "0" : "3px";
}

/* Size the bitmap and take a fresh context. Safe to call repeatedly. */
function initCanvasBitmap() {
  if (!CANVAS) makeCanvas();
  sizeCanvasToViewport(CANVAS);          // settles W before sizing the bitmap
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  DPR = dpr;
  CANVAS.width = W * dpr;
  CANVAS.height = H * dpr;
  CANVAS.style.aspectRatio = W + " / " + H;
  CTX = CANVAS.getContext("2d");
  CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  rebuildBackdrop();
}

/* The pre-rendered cypress bands are drawn at a specific width, so they have
   to be redrawn whenever the world reshapes. */
function rebuildBackdrop() {
  const bg = document.createElement("canvas");
  bg.width = W * DPR;
  bg.height = H * DPR;
  const bctx = bg.getContext("2d");
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if ((META.place ?? 0) === 0) {
    drawBand(bctx, BANDS[0], 0, WATER_Y);
    drawBand(bctx, BANDS[1], 0, WATER_Y);
  }
  BG = bg;
}

/* Restore a save into the live game.

   This used to list fields by hand and silently dropped anything added
   later — which is exactly how gold shells, guns and finishes vanished on
   every load. It now starts from the sanitized save and only fills in what
   is genuinely missing, so a field added to the game in future is carried
   through without anyone having to remember to update this function. */
function loadInto(d) {
  const m = newGame();
  const clean = (Save.sanitize ? Save.sanitize(d) : d) || {};

  // copy everything the save has, then repair anything absent
  for (const key of Object.keys(clean)) m[key] = clean[key];

  m.hunter = m.hunter || "Hunter";
  m.dogName = m.dogName || "Scout";
  m.money = m.money ?? 0;
  m.round = m.round ?? 1;
  m.best = m.best ?? 0;
  m.gb = m.gb ?? 0;
  m.weapon = m.weapon || "pump";
  m.skin = m.skin || "blued";
  m.weapons = Array.isArray(m.weapons) && m.weapons.length ? m.weapons : ["pump"];
  m.skins = Array.isArray(m.skins) && m.skins.length ? m.skins : ["blued"];
  m.ducks = Array.isArray(m.ducks) ? m.ducks : DUCKS.map((dk, i) => i === 0 || !!dk.onlyAt);
  m.places = Array.isArray(m.places) ? m.places : PLACES.map((_, i) => i === 0);
  m.place = m.place ?? 0;
  m.hired = { dog2: false, hunter2: false, ...(m.hired || {}) };
  m.lvl = { ...BLANK_LVL, ...(m.lvl || {}) };

  META = m;

  // one-time make-good for progress lost to the old save bug
  const granted = applyGrant(META);
  if (granted) {
    GRANT_NOTICE = granted;
    persist();
  }
}

/* Landscape is a much bigger playing field on a phone — 16:10 in portrait
   leaves the game about a third of the screen. A hint, not a blocker. */
function orientationHint() {
  if (!isNarrow() || !isPortrait()) return null;
  const bar = el("div", {
    fontFamily: MONO, fontSize: "11px", color: "#C9A227",
    textAlign: "center", padding: "7px 10px", marginBottom: "6px",
    border: "1px solid #3A3520", borderRadius: "2px",
    background: "rgba(201,162,39,0.08)",
  }, "↻ Turn your phone sideways for a bigger view");
  return bar;
}

let resizeTimer = 0;
function refit() {
  if (!CANVAS) { render(); return; }
  const before = W;
  sizeCanvasToViewport(CANVAS);
  if (W !== before) initCanvasBitmap();   // world reshaped — new bitmap
  render();
}
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(refit, 150);
});
// iOS fires orientationchange before the new dimensions settle, so re-fit
// again a moment later or the game keeps the old size after a rotate.
window.addEventListener("orientationchange", () => {
  setTimeout(refit, 60);
  setTimeout(refit, 350);
});

/* Another device saved while we're open. Adopt it if we're in a menu; if a
   round is in progress, wait rather than yanking the game out from under
   the player. */
window.onRemoteSaveChanged = async function () {
  if (SCREEN === "playing") return;
  const fresh = await Save.load();
  if (!fresh) return;
  loadInto(fresh);
  SAVED = fresh;
  UI.note("Updated from another device");
  render();
};

/* ---------------- boot ---------------- */

window.addEventListener("keydown", (e) => {
  if (SCREEN !== "playing") return;
  if (e.code === "Space" || e.code === "Escape") {
    e.preventDefault();
    Sound.resume();
    setPause(!(G && G.paused));
  }
});

document.addEventListener("visibilitychange", () => {
  if (document.hidden && SCREEN === "playing") setPause(true);
});

(async function boot() {
  REDUCED = window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches ?? false;
  await Save.probe();
  const m = await STORE.get("limitout:muted");
  Sound.setMuted(m === "1");
  SAVED = await Save.load();
  render();
})();

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
window.addEventListener("appinstalled", function () { track("pwa_installed"); });
</script>
